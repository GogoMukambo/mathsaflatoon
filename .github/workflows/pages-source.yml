name: Set GitHub Pages source to docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  set-source:
    runs-on: ubuntu-latest
    steps:
      - name: Publish main /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f source[branch]=main \
            -f source[path]=/docs
          gh api "repos/${{ github.repository }}/pages"
