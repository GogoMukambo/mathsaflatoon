<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Fastest particles escape during evaporation">
  <rect width="800" height="420" fill="#ecfeff"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">Evaporation: the fastest particles leave the surface</text>
  <rect x="80" y="220" width="640" height="140" rx="10" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <text x="400" y="340" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="700">liquid  particles left behind have lower average energy</text>
  <circle cx="180" cy="270" r="10" fill="#1d4ed8"/>
  <circle cx="240" cy="300" r="10" fill="#1d4ed8"/>
  <circle cx="320" cy="280" r="10" fill="#2563eb"/>
  <circle cx="400" cy="310" r="10" fill="#1e40af"/>
  <circle cx="490" cy="275" r="10" fill="#1d4ed8"/>
  <circle cx="580" cy="300" r="10" fill="#1e3a8a"/>
  <circle cx="660" cy="270" r="10" fill="#1d4ed8"/>
  <circle r="8" fill="#ef4444">
    <animate attributeName="cy" values="230;70;70" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;250;280" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="8" fill="#f97316">
    <animate attributeName="cy" values="225;90;90" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="420;400;390" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="8" fill="#dc2626">
    <animate attributeName="cy" values="228;60;60" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="560;600;640" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="80" text-anchor="middle" fill="#b91c1c" font-size="15" font-weight="700">highest-energy particles become gas</text>
  <text x="400" y="400" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="700">average energy falls ’ temperature falls ’ cooling</text>
</svg>
