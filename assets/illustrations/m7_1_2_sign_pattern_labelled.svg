<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">MULTIPLYING INTEGERS</text>
  <text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Follow the pattern into two negatives</text>

  <rect x="70" y="190" width="520" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="330" y="232" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Sequence from the book</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <rect x="120" y="250" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="283" fill="#1e3a8a">-3  &#215;  4  =  -12</text>
    <rect x="120" y="308" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="341" fill="#1e3a8a">-3  &#215;  3  =  -9</text>
    <rect x="120" y="366" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="399" fill="#1e3a8a">-3  &#215;  2  =  -6</text>
    <rect x="120" y="424" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="457" fill="#1e3a8a">-3  &#215;  1  =  -3</text>
    <rect x="120" y="482" width="420" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="330" y="515" fill="#334155">-3  &#215;  0  =  0</text>
    <rect x="120" y="540" width="420" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="330" y="573" fill="#065f46">-3  &#215;  -1  =  3</text>
    <rect x="120" y="598" width="420" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="330" y="631" fill="#065f46">-3  &#215;  -2  =  6</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="720" cy="300" r="28" fill="#2563eb"/>
    <text x="720" y="310" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">1</text>
    <rect x="764" y="248" width="360" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="944" y="290" text-anchor="middle" fill="#1e40af" font-size="20" font-weight="700">Second number down by 1</text>
    <text x="944" y="322" text-anchor="middle" fill="#334155" font-size="18">4,  3,  2,  1,  0,  -1,  -2</text>

    <circle cx="720" cy="460" r="28" fill="#ea580c"/>
    <text x="720" y="470" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">2</text>
    <rect x="764" y="408" width="360" height="104" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="944" y="450" text-anchor="middle" fill="#c2410c" font-size="20" font-weight="700">Product up by 3</text>
    <text x="944" y="482" text-anchor="middle" fill="#334155" font-size="18">-12, -9, -6, -3, 0, 3, 6</text>

    <circle cx="720" cy="620" r="28" fill="#059669"/>
    <text x="720" y="630" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">3</text>
    <rect x="764" y="568" width="360" height="104" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="944" y="610" text-anchor="middle" fill="#065f46" font-size="20" font-weight="700">Two negatives make a positive</text>
    <text x="944" y="642" text-anchor="middle" fill="#334155" font-size="18">-3  &#215;  -2  =  6</text>
  </g>

  <rect x="1180" y="248" width="350" height="424" rx="18" fill="#0f172a"/>
  <text x="1355" y="300" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Sign rule</text>
  <rect x="1210" y="330" width="290" height="130" rx="12" fill="#ecfdf5"/>
  <text x="1355" y="380" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Same signs</text>
  <text x="1355" y="416" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">POSITIVE</text>
  <rect x="1210" y="490" width="290" height="130" rx="12" fill="#fff7ed"/>
  <text x="1355" y="540" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Different signs</text>
  <text x="1355" y="576" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">NEGATIVE</text>

  <rect y="808" width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">KEY IDEAS  |  Same signs = positive  |  Different signs = negative</text>
</svg>
