<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="92" fill="#0f172a"/>
<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">HIGHEST COMMON FACTOR</text>
<text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">9 is the largest factor of both 18 and 27.</text>
<rect x="70" y="186" width="700" height="280" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Factors of 18</text>
  <rect x="140" y="280" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="178" y="316" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1</text>
<rect x="228" y="280" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="266" y="316" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2</text>
<rect x="316" y="280" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="354" y="316" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">3</text>
<rect x="404" y="280" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="442" y="316" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">6</text>
<rect x="492" y="280" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="530" y="316" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">9</text>
<rect x="140" y="350" width="76" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="178" y="386" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">18</text>
  <text x="420" y="430" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">18 = 1×18 or 2×9 or 3×6</text>
  <rect x="830" y="186" width="700" height="280" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1180" y="232" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Factors of 27</text>
  <rect x="900" y="280" width="76" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="938" y="316" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1</text>
<rect x="988" y="280" width="76" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1026" y="316" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">3</text>
<rect x="1076" y="280" width="76" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1114" y="316" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">9</text>
<rect x="1164" y="280" width="76" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1202" y="316" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">27</text>
  <rect x="70" y="490" width="1460" height="280" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="800" y="548" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Common factors  1, 3, 9</text>
  <text x="800" y="660" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">HCF(18, 27) = 9</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">KEY IDEA  |  HCF is the largest shared factor</text>
</svg>