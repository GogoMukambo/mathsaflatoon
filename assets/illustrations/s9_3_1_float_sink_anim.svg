<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Wood floats and steel sinks because of density">
  <rect width="800" height="420" fill="#f0f9ff"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Less dense than water floats · more dense sinks</text>
  <rect x="80" y="80" width="280" height="260" rx="12" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
  <rect x="80" y="200" width="280" height="140" fill="#38bdf8" opacity="0.55"/>
  <text x="220" y="105" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="700">Water = 1.0 g/cm³</text>
  <rect x="160" y="168" width="120" height="44" rx="6" fill="#d97706">
    <animate attributeName="y" values="168;176;168" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="220" y="196" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">wood 0.75
    <animate attributeName="y" values="196;204;196" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <rect x="440" y="80" width="280" height="260" rx="12" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
  <rect x="440" y="200" width="280" height="140" fill="#38bdf8" opacity="0.55"/>
  <text x="580" y="105" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="700">Water = 1.0 g/cm³</text>
  <rect x="530" y="248" width="100" height="40" rx="4" fill="#475569">
    <animate attributeName="y" values="210;248;248" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="580" y="274" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">steel 7.8
    <animate attributeName="y" values="236;274;274" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <text x="220" y="370" text-anchor="middle" fill="#047857" font-size="15" font-weight="700">FLOATS</text>
  <text x="580" y="370" text-anchor="middle" fill="#b91c1c" font-size="15" font-weight="700">SINKS</text>
</svg>
