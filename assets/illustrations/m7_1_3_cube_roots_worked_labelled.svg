<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">ONE CUBE ROOT EACH</text>
  <text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Positive, negative or zero - only one cube root</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="186" width="480" height="280" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="300" y="236" fill="#065f46" font-size="22" font-weight="700">Positive cube</text>
    <text x="300" y="300" fill="#0f172a" font-size="34" font-weight="700">5&#179; = 125</text>
    <text x="300" y="350" fill="#334155" font-size="22">5 &#215; 5 &#215; 5 = 125</text>
    <text x="300" y="420" fill="#047857" font-size="32" font-weight="700">&#8731;125 = 5</text>
    <rect x="560" y="186" width="480" height="280" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="800" y="236" fill="#c2410c" font-size="22" font-weight="700">Negative cube</text>
    <text x="800" y="300" fill="#0f172a" font-size="34" font-weight="700">(-5)&#179; = -125</text>
    <text x="800" y="350" fill="#334155" font-size="20">-5 &#215; -5 &#215; -5 = 25 &#215; -5 = -125</text>
    <text x="800" y="420" fill="#c2410c" font-size="32" font-weight="700">&#8731;(-125) = -5</text>
    <rect x="1060" y="186" width="480" height="280" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1300" y="236" fill="#1e40af" font-size="22" font-weight="700">Not a cube root of 125</text>
    <text x="1300" y="300" fill="#0f172a" font-size="28" font-weight="700">-5 is not &#8731;125</text>
    <text x="1300" y="350" fill="#334155" font-size="20">because (-5)&#179; is -125</text>
    <text x="1300" y="420" fill="#1d4ed8" font-size="26" font-weight="700">one root only</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="506" fill="#334155" font-size="22" font-weight="700">Worked example 1.3</text>
    <rect x="60" y="526" width="480" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="576" fill="#1e40af" font-size="20" font-weight="700">a   x&#178; = 64</text>
    <text x="300" y="630" fill="#0f172a" font-size="26" font-weight="700">&#8730;64 = 8</text>
    <text x="300" y="676" fill="#0f172a" font-size="26" font-weight="700">-&#8730;64 = -8</text>
    <text x="300" y="736" fill="#1d4ed8" font-size="24" font-weight="700">x = 8 or x = -8</text>
    <rect x="560" y="526" width="480" height="250" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="800" y="576" fill="#065f46" font-size="20" font-weight="700">b   x&#179; = 64</text>
    <text x="800" y="640" fill="#0f172a" font-size="28" font-weight="700">4 &#215; 4 &#215; 4 = 64</text>
    <text x="800" y="700" fill="#047857" font-size="28" font-weight="700">&#8731;64 = 4</text>
    <text x="800" y="746" fill="#065f46" font-size="24" font-weight="700">x = 4</text>
    <rect x="1060" y="526" width="480" height="250" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1300" y="576" fill="#c2410c" font-size="20" font-weight="700">c   x&#179; + 64 = 0</text>
    <text x="1300" y="640" fill="#0f172a" font-size="26" font-weight="700">x&#179; = -64</text>
    <text x="1300" y="700" fill="#c2410c" font-size="28" font-weight="700">&#8731;(-64) = -4</text>
    <text x="1300" y="746" fill="#9a3412" font-size="24" font-weight="700">x = -4</text>
  </g>
</svg>
