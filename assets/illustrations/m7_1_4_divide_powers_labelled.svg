<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">DIVIDING POWERS</text>
  <text x="800" y="148" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Same base? Subtract the indices. 32 &#247; 4 = 8 becomes 2&#8309; &#247; 2&#178; = 2&#179;.</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="186" width="460" height="390" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="290" y="236" fill="#065f46" font-size="22" font-weight="700">Book starter</text>
    <text x="290" y="300" fill="#0f172a" font-size="34" font-weight="700">32 &#247; 4 = 8</text>
    <text x="290" y="360" fill="#334155" font-size="24">write as powers of 2</text>
    <rect x="110" y="390" width="360" height="140" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="290" y="450" fill="#065f46" font-size="22">subtract the little numbers</text>
    <text x="290" y="504" fill="#047857" font-size="36" font-weight="700">2&#8309; &#247; 2&#178; = 2&#179;</text>
    <rect x="570" y="186" width="460" height="390" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="800" y="236" fill="#1d4ed8" font-size="22" font-weight="700">Same powers make 1</text>
    <text x="800" y="318" fill="#0f172a" font-size="30" font-weight="700">5&#8310; &#247; 5&#8308; = 5&#178;</text>
    <text x="800" y="386" fill="#0f172a" font-size="30" font-weight="700">2&#8311; &#247; 2&#8309; = 2&#178;</text>
    <rect x="620" y="420" width="360" height="120" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="800" y="468" fill="#1e3a8a" font-size="20">same number &#247; itself</text>
    <text x="800" y="516" fill="#1d4ed8" font-size="30" font-weight="700">5&#8310; &#247; 5&#8310; = 5&#8304; = 1</text>
    <rect x="1080" y="186" width="460" height="390" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1310" y="236" fill="#c2410c" font-size="22" font-weight="700">Brackets multiply</text>
    <text x="1310" y="300" fill="#0f172a" font-size="28" font-weight="700">(3&#178;)&#179; = 3&#178; &#215; 3&#178; &#215; 3&#178;</text>
    <text x="1310" y="368" fill="#c2410c" font-size="36" font-weight="700">(3&#178;)&#179; = 3&#8310;</text>
    <text x="1310" y="450" fill="#0f172a" font-size="26">2 &#215; 3 = 6</text>
    <text x="1310" y="520" fill="#9a3412" font-size="20">(a&#7504;)&#8319; = a&#7504;&#8319;</text>
  </g>
  <rect x="60" y="600" width="1480" height="180" rx="16" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#f8fafc">
    <text x="800" y="660" font-size="24" font-weight="700">Generalise</text>
    <text x="800" y="718" font-size="32" font-weight="700">a&#7504; &#247; a&#8319; = a&#7504;&#8315;&#8319;     ·     (a&#7504;)&#8319; = a&#7504;&#8319;</text>
    <text x="800" y="760" font-size="20" fill="#cbd5e1">5&#8308; &#247; 5&#8310; needs a negative index  not in this section.</text>
  </g>
  <rect y="808" width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">CHECK  |  Same base  |  Divide means subtract  |  Brackets multiply</text>
</svg>
