<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="92" fill="#0f172a"/>
<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">NEGATIVE PRODUCTS</text>
<text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">A positive times a negative is always negative.</text>
<rect x="80" y="186" width="680" height="580" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="420" y="228" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">6 × −4</text>
<text x="420" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">6 × 4 = 24</text>
<text x="420" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">so 6 × −4 = −24</text>
<text x="420" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Different signs → negative</text>
  <rect x="840" y="186" width="680" height="580" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1180" y="228" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">−9 × 3</text>
<text x="1180" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">9 × 3 = 27</text>
<text x="1180" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">so −9 × 3 = −27</text>
<text x="1180" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">−12 is the product of −3 and 4</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">KEY IDEA  |  Product of + and − is negative</text>
</svg>