<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="92" fill="#0f172a"/>
<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">SUBTRACT BY ADDING THE INVERSE</text>
<text x="800" y="148" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">The inverse of 6 is −6. The inverse of −3 is 3.</text>
<rect x="60" y="186" width="480" height="580" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="228" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2 − 6</text>
<text x="300" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Inverse of 6 is −6</text>
<text x="300" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">2 − 6 = 2 + −6</text>
<text x="300" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">2 + −6 = −4</text>
  <rect x="560" y="186" width="480" height="580" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="800" y="228" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">−4 − −3</text>
<text x="800" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Inverse of −3 is 3</text>
<text x="800" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">−4 − −3 = −4 + 3</text>
<text x="800" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">−4 + 3 = −1</text>
  <rect x="1060" y="186" width="480" height="580" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1300" y="228" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2 − −4</text>
<text x="1300" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Inverse of −4 is 4</text>
<text x="1300" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">2 − −4 = 2 + 4</text>
<text x="1300" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">2 + 4 = 6</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">RECALL  |  a − b = a + (inverse of b)</text>
</svg>