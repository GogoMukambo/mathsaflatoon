<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200" width="1600" height="2200">
  <rect width="1600" height="2200" fill="#f8fafc"/>
  <text x="800" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a">Year 7 Science · Chapter 1 Respiration</text>
  <text x="800" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#475569">Four diagrams for 13-year-olds · 1.1 to 1.4</text>

  <!-- ========== 1.1 Respiratory system ========== -->
  <rect x="40" y="140" width="1520" height="480" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">1.1 The human respiratory system</text>
  <text x="72" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Air travels: nose / mouth ’ larynx ’ trachea ’ bronchi ’ bronchioles ’ alveoli</text>

  <!-- simplified torso outline -->
  <ellipse cx="420" cy="430" rx="170" ry="150" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <!-- head -->
  <circle cx="420" cy="268" r="42" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <!-- nose/mouth -->
  <path d="M 408 262 Q 420 270 432 262" fill="none" stroke="#92400e" stroke-width="2"/>
  <!-- trachea -->
  <rect x="408" y="308" width="24" height="78" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <!-- cartilage rings -->
  <line x1="410" y1="322" x2="430" y2="322" stroke="#0284c7" stroke-width="3"/>
  <line x1="410" y1="338" x2="430" y2="338" stroke="#0284c7" stroke-width="3"/>
  <line x1="410" y1="354" x2="430" y2="354" stroke="#0284c7" stroke-width="3"/>
  <line x1="410" y1="370" x2="430" y2="370" stroke="#0284c7" stroke-width="3"/>
  <!-- bronchi -->
  <path d="M 420 386 Q 360 430 300 470" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 420 386 Q 480 430 540 470" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
  <!-- lungs -->
  <ellipse cx="330" cy="470" rx="78" ry="92" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="510" cy="470" rx="78" ry="92" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <!-- diaphragm -->
  <path d="M 250 560 Q 420 610 590 560" fill="none" stroke="#16a34a" stroke-width="6"/>
  <text x="420" y="598" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">diaphragm</text>

  <!-- callouts -->
  <line x1="420" y1="250" x2="640" y2="236" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="640" y="216" width="170" height="34" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="725" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">nose and mouth</text>

  <line x1="432" y1="350" x2="640" y2="292" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="640" y="272" width="250" height="34" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="765" y="294" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">trachea (windpipe) + cartilage rings</text>

  <line x1="360" y1="430" x2="640" y2="348" stroke="#15803d" stroke-width="1.5"/>
  <rect x="640" y="328" width="210" height="34" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="745" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">bronchi ’ bronchioles</text>

  <line x1="510" y1="500" x2="640" y2="404" stroke="#15803d" stroke-width="1.5"/>
  <rect x="640" y="384" width="280" height="34" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="780" y="406" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">lungs with air sacs (alveoli)</text>

  <rect x="980" y="250" width="540" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1250" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Remember</text>
  <text x="1010" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Cartilage rings keep the trachea open.</text>
  <text x="1010" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Mucus traps dust. Cilia sweep it up and out.</text>
  <text x="1010" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#334155">The diaphragm and rib muscles move the air.</text>
  <text x="1010" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0369a1">Air in  ’  trachea  ’  bronchi  ’  alveoli</text>

  <!-- ========== 1.2 Gas exchange ========== -->
  <rect x="40" y="640" width="1520" height="480" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="684" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">1.2 Gas exchange</text>
  <text x="72" y="714" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Oxygen goes into the blood. Carbon dioxide comes out. This happens in the alveoli.</text>

  <!-- alveolus cluster -->
  <circle cx="280" cy="900" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <circle cx="360" cy="860" r="62" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <circle cx="370" cy="950" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <circle cx="250" cy="820" r="48" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="910" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">alveoli</text>

  <!-- capillary -->
  <path d="M 430 900 C 520 840 620 840 720 900 C 620 960 520 960 430 900" fill="#fecaca" stroke="#b91c1c" stroke-width="10"/>
  <circle cx="560" cy="868" r="14" fill="#ef4444"/>
  <circle cx="620" cy="900" r="14" fill="#ef4444"/>
  <circle cx="500" cy="910" r="12" fill="#b91c1c"/>
  <text x="575" y="980" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">capillary (blood)</text>

  <!-- O2 arrow -->
  <path d="M 360 880 L 500 880" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="430" y="868" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">O‚</text>
  <!-- CO2 arrow -->
  <path d="M 500 930 L 360 930" fill="none" stroke="#ea580c" stroke-width="5"/>
  <polygon points="360,930 378,922 378,938" fill="#ea580c"/>
  <text x="430" y="958" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#c2410c">CO‚</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="820" y="760" width="700" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1170" y="800" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Why alveoli work so well</text>
  <text x="860" y="850" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#334155">1. Huge surface area  lots of tiny sacs</text>
  <text x="860" y="890" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#334155">2. Walls one cell thick  a very short journey</text>
  <text x="860" y="930" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#334155">3. Rich blood supply  steep concentration gradient</text>
  <text x="860" y="990" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0369a1">Even at rest, blood arriving has less oxygen than alveolar air, so O‚ still diffuses in.</text>

  <!-- ========== 1.3 Breathing ========== -->
  <rect x="40" y="1140" width="1520" height="500" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="1184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">1.3 Breathing</text>
  <text x="72" y="1214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Breathing moves air. Inhale: chest gets bigger. Exhale: chest gets smaller.</text>

  <!-- inhale -->
  <rect x="80" y="1240" width="680" height="360" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="420" y="1280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#065f46">Breathe IN</text>
  <ellipse cx="300" cy="1440" rx="70" ry="95" fill="#86efac" stroke="#15803d" stroke-width="3"/>
  <ellipse cx="540" cy="1440" rx="70" ry="95" fill="#86efac" stroke="#15803d" stroke-width="3"/>
  <path d="M 230 1540 Q 420 1590 610 1540" fill="none" stroke="#16a34a" stroke-width="7"/>
  <path d="M 420 1548 L 420 1588 L 410 1574 M 420 1588 L 430 1574" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M 230 1410 L 190 1360 M 190 1378 L 190 1360 L 210 1360" fill="none" stroke="#ea580c" stroke-width="3"/>
  <path d="M 610 1410 L 650 1360 M 630 1360 L 650 1360 L 650 1378" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="420" y="1578" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">diaphragm flattens</text>
  <text x="420" y="1350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">ribs lift up and out</text>
  <text x="420" y="1310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#065f46">volume ‘  pressure “  air is sucked in</text>

  <!-- exhale -->
  <rect x="840" y="1240" width="680" height="360" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1180" y="1280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a3412">Breathe OUT</text>
  <ellipse cx="1060" cy="1440" rx="55" ry="72" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
  <ellipse cx="1300" cy="1440" rx="55" ry="72" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
  <path d="M 1000 1510 Q 1180 1450 1360 1510" fill="none" stroke="#16a34a" stroke-width="7"/>
  <path d="M 1180 1455 L 1180 1410 L 1170 1424 M 1180 1410 L 1190 1424" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M 1005 1380 L 1045 1415" fill="none" stroke="#ea580c" stroke-width="3"/>
  <path d="M 1355 1380 L 1315 1415" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="1180" y="1570" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">diaphragm domes up</text>
  <text x="1180" y="1350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">ribs drop in</text>
  <text x="1180" y="1310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a3412">volume “  pressure ‘  air is pushed out</text>

  <!-- ========== 1.4 Respiration ========== -->
  <rect x="40" y="1660" width="1520" height="500" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="1704" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">1.4 Respiration (in cells)</text>
  <text x="72" y="1734" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Breathing moves air. Respiration is the chemical reaction that releases energy from glucose.</text>

  <rect x="80" y="1760" width="320" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="1810" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">Breathing</text>
  <text x="240" y="1840" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">moves air in and out of lungs</text>

  <rect x="460" y="1760" width="320" height="120" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="1810" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#15803d">Respiration</text>
  <text x="620" y="1840" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#334155">chemical reaction inside cells</text>

  <!-- mitochondrion -->
  <ellipse cx="1180" cy="1820" rx="220" ry="90" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <path d="M 1020 1820 C 1060 1760 1100 1880 1140 1820 C 1180 1760 1220 1880 1260 1820 C 1300 1760 1340 1840 1360 1820" fill="none" stroke="#b45309" stroke-width="4"/>
  <text x="1180" y="1830" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#92400e">mitochondrion</text>

  <rect x="120" y="1920" width="1360" height="90" rx="14" fill="#0f172a"/>
  <text x="800" y="1956" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">glucose + oxygen  ’  carbon dioxide + water  (+ energy)</text>
  <text x="800" y="1988" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">aerobic respiration  ·  happens inside cells, not in the lungs</text>

  <text x="800" y="2060" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Exercise makes you breathe faster because muscles need more oxygen and make more carbon dioxide.</text>
  <text x="800" y="2120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Abhyaas · Year 7 Science · Chapter 1</text>
</svg>
