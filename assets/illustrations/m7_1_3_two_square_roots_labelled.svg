<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">TWO SQUARE ROOTS</text>
  <text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Every positive integer has a positive root and a negative root</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="186" width="460" height="390" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="290" y="236" fill="#c2410c" font-size="22" font-weight="700">Positive square</text>
    <text x="290" y="300" fill="#0f172a" font-size="36" font-weight="700">5&#178; = 25</text>
    <text x="290" y="356" fill="#334155" font-size="24">5 &#215; 5 = 25</text>
    <rect x="110" y="390" width="360" height="140" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="290" y="450" fill="#9a3412" font-size="22">positive square root</text>
    <text x="290" y="504" fill="#c2410c" font-size="36" font-weight="700">&#8730;25 = 5</text>
    <rect x="570" y="186" width="460" height="390" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="800" y="236" fill="#065f46" font-size="22" font-weight="700">Negative square</text>
    <text x="800" y="300" fill="#0f172a" font-size="36" font-weight="700">(-5)&#178; = 25</text>
    <text x="800" y="356" fill="#334155" font-size="24">-5 &#215; -5 = 25</text>
    <rect x="620" y="390" width="360" height="140" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="800" y="450" fill="#065f46" font-size="22">negative square root</text>
    <text x="800" y="504" fill="#047857" font-size="36" font-weight="700">&#8730;25 = -5</text>
    <rect x="1080" y="186" width="460" height="390" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1310" y="236" fill="#991b1b" font-size="22" font-weight="700">No real square root</text>
    <text x="1310" y="300" fill="#0f172a" font-size="36" font-weight="700">x&#178; = -25</text>
    <text x="1310" y="356" fill="#334155" font-size="22">a square is never negative</text>
    <rect x="1130" y="390" width="360" height="140" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="1310" y="450" fill="#991b1b" font-size="22">-25 has no square root</text>
    <text x="1310" y="504" fill="#dc2626" font-size="30" font-weight="700">no solution</text>
  </g>
  <rect x="60" y="600" width="1480" height="180" rx="16" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#f8fafc">
    <text x="800" y="660" font-size="24" font-weight="700">Worked idea from the book</text>
    <text x="800" y="718" font-size="28" font-weight="700">Natural numbers keep only +5. Integers also keep -5.</text>
    <text x="800" y="760" font-size="20" fill="#cbd5e1">5 is the positive square root of 25. -5 is the negative square root.</text>
  </g>
  <rect y="808" width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">KEY IDEAS  |  Two square roots for positives  |  None for negatives</text>
</svg>
