<text x="300" y="228" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">÷ 11</text>
<text x="300" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Odd: 8+2+* = 10+*</text>
<text x="300" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Even: 5+7 = 12</text>
<text x="300" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">* = 2 → difference 0</text>
<text x="300" y="400" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">27258 works</text>
  <rect x="560" y="186" width="480" height="580" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="800" y="228" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">÷ 6</text>
<text x="800" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Last digit 8 → ÷ 2</text>
<text x="800" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">* + 22 is a multiple of 3</text>
<text x="800" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">* = 2, 5 or 8</text>
  <rect x="1060" y="186" width="480" height="580" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1300" y="228" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">÷ 66</text>
<text x="1300" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Needs ÷ 6 and ÷ 11</text>
<text x="1300" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Only * = 2</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">CHECK  |  11 and 66 when * = 2   ·   6 when * = 2, 5 or 8</text>
