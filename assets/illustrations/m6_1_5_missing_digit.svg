<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">MISSING DIGIT  *7258</text>
<text x="800" y="148" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Combine the tests for 6, 11 and 66.</text>
