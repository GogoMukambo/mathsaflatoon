<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="3">NATURAL, INTEGER, RATIONAL</text>
  <text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Any number you can write as a fraction is rational</text>
  <circle cx="620" cy="470" r="300" fill="#ecfdf5" stroke="#059669" stroke-width="4"/>
  <circle cx="560" cy="490" r="210" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="500" cy="510" r="120" fill="#fef9c3" stroke="#ca8a04" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    <text x="820" y="210" fill="#047857" font-size="28">Q  rational numbers</text>
    <text x="690" y="300" fill="#1d4ed8" font-size="26">I  integers</text>
    <text x="460" y="400" fill="#a16207" font-size="24" text-anchor="middle">N  natural</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <text x="500" y="470" fill="#854d0e" font-size="22">0   5   16</text>
    <text x="500" y="548" fill="#713f12" font-size="18">counting numbers and 0</text>
    <text x="680" y="430" fill="#1e3a8a" font-size="22">-500   -3</text>
    <text x="860" y="380" fill="#065f46" font-size="22">-1/5   -4.8</text>
    <text x="900" y="430" fill="#065f46" font-size="22">99&#189;   6.3</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="1060" y="200" width="480" height="170" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="1300" y="250" fill="#854d0e" font-size="20" font-weight="700">Natural numbers N</text>
    <text x="1300" y="296" fill="#334155" font-size="20">counting numbers and zero</text>
    <text x="1300" y="340" fill="#0f172a" font-size="22" font-weight="700">0, 1, 2, 5, 16 ...</text>
    <rect x="1060" y="390" width="480" height="170" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1300" y="440" fill="#1e40af" font-size="20" font-weight="700">Integers I</text>
    <text x="1300" y="486" fill="#334155" font-size="20">whole numbers +, - or 0</text>
    <text x="1300" y="530" fill="#0f172a" font-size="22" font-weight="700">... -500, -3, 0, 5, 16 ...</text>
    <rect x="1060" y="580" width="480" height="190" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="1300" y="630" fill="#065f46" font-size="20" font-weight="700">Rational numbers Q</text>
    <text x="1300" y="676" fill="#334155" font-size="20">can be written as a fraction</text>
    <text x="1300" y="722" fill="#0f172a" font-size="20" font-weight="700">integers, -1/5, -4.8, 99&#189;</text>
  </g>
  <rect y="808" width="1600" height="92" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">KEY IDEAS  |  N inside I  |  I inside Q  |  all of the list is rational</text>
</svg>
