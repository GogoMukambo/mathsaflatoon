<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="92" fill="#0f172a"/>
<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">TESTS FOR 2, 3, 4 AND 5</text>
<text x="800" y="148" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Try 87654. A number is divisible when there is no remainder.</text>
<rect x="80" y="186" width="1440" height="88" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="180" y="240" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">÷ 2</text>
  <text x="360" y="240" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">YES</text>
  <text x="500" y="240" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Last digit 4 is even</text>
  <rect x="80" y="294" width="1440" height="88" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="180" y="348" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">÷ 3</text>
  <text x="360" y="348" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">YES</text>
  <text x="500" y="348" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Digit sum 8+7+6+5+4 = 30 = 10 × 3</text>
  <rect x="80" y="402" width="1440" height="88" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="456" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">÷ 4</text>
  <text x="360" y="456" fill="#991b1b" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">NO</text>
  <text x="500" y="456" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Last two digits 54 ÷ 4 = 13 r 2</text>
  <rect x="80" y="510" width="1440" height="88" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="564" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">÷ 5</text>
  <text x="360" y="564" fill="#991b1b" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">NO</text>
  <text x="500" y="564" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Last digit is 4, not 0 or 5</text>
  <text x="800" y="680" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">30 is divisible by 2, 3 and 5. 30 ÷ 4 = 7 r 2.</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">KEY IDEA  |  87654 is divisible by 2 and 3, not by 4 or 5</text>
</svg>