<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="92" fill="#0f172a"/>
<text x="800" y="62" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="2">BRACKETS FIRST</text>
<text x="800" y="148" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Tidy the bracket, then multiply.</text>
<rect x="120" y="186" width="1360" height="580" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="800" y="228" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">5 × (1 + −4)</text>
<text x="800" y="274" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">1 + −4 = −3</text>
<text x="800" y="316" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">5 × −3 = −15</text>
<text x="800" y="358" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Mixed signs keep the product negative</text>
<rect y="808" width="1600" height="92" fill="#0f172a"/>
<text x="800" y="864" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">CHECK  |  5 × (1 + −4) = −15</text>
</svg>