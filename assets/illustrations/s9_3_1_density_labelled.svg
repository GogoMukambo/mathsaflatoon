<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <rect width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Density = mass per unit volume</text>
  <rect x="60" y="80" width="220" height="160" rx="8" fill="#78716c" stroke="#44403c" stroke-width="2"/>
  <text x="170" y="120" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Iron cube 1 cm³</text>
  <text x="170" y="150" text-anchor="middle" fill="#fef3c7" font-size="13">mass = 7.9 g</text>
  <text x="170" y="180" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700">Á = 7.9 g/cm³</text>
  <rect x="320" y="100" width="160" height="120" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" fill="#713f12" font-size="14" font-weight="600">Polystyrene 1 cm³</text>
  <text x="400" y="170" text-anchor="middle" fill="#713f12" font-size="13">mass = 0.05 g</text>
  <text x="400" y="200" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="700">Á = 0.05 g/cm³</text>
  <rect x="520" y="70" width="220" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="105" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="600">Water</text>
  <text x="630" y="135" text-anchor="middle" fill="#1e40af" font-size="13">Á = 1.0 g/cm³</text>
  <line x1="560" y1="160" x2="700" y2="160" stroke="#2563eb" stroke-width="3"/>
  <text x="630" y="185" text-anchor="middle" fill="#64748b" font-size="12">Compare to predict</text>
  <text x="630" y="210" text-anchor="middle" fill="#64748b" font-size="12">float or sink</text>
  <rect x="100" y="280" width="600" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#9a3412">density = mass ÷ volume</text>
  <text x="400" y="390" text-anchor="middle" fill="#475569" font-size="14">Same volume · different mass ’ different density</text>
  <text x="400" y="420" text-anchor="middle" fill="#475569" font-size="14">Less dense than water (1.0) floats · more dense sinks</text>
</svg>
