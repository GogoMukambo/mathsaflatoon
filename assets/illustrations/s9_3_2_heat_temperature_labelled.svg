<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <rect width="800" height="500" fill="#fafafa"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Heat vs temperature</text>
  <rect x="80" y="80" width="280" height="200" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-size="15" font-weight="600">Small beaker · 25 °C</text>
  <circle cx="160" cy="180" r="8" fill="#3b82f6"/><circle cx="200" cy="170" r="8" fill="#3b82f6"/><circle cx="240" cy="190" r="8" fill="#3b82f6"/>
  <circle cx="180" cy="210" r="8" fill="#3b82f6"/><circle cx="220" cy="220" r="8" fill="#3b82f6"/><circle cx="260" cy="175" r="8" fill="#3b82f6"/>
  <text x="220" y="255" text-anchor="middle" fill="#64748b" font-size="12">Fewer particles</text>
  <text x="220" y="275" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="600">Less total heat (J)</text>
  <rect x="440" y="80" width="280" height="200" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="580" y="110" text-anchor="middle" font-size="15" font-weight="600">Large beaker · 25 °C</text>
  <g fill="#3b82f6">
    <circle cx="500" cy="150" r="7"/><circle cx="530" cy="165" r="7"/><circle cx="560" cy="155" r="7"/><circle cx="590" cy="170" r="7"/><circle cx="620" cy="160" r="7"/><circle cx="650" cy="175" r="7"/>
    <circle cx="510" cy="190" r="7"/><circle cx="540" cy="200" r="7"/><circle cx="570" cy="185" r="7"/><circle cx="600" cy="205" r="7"/><circle cx="630" cy="195" r="7"/><circle cx="660" cy="210" r="7"/>
    <circle cx="520" cy="230" r="7"/><circle cx="550" cy="240" r="7"/><circle cx="580" cy="225" r="7"/><circle cx="610" cy="235" r="7"/><circle cx="640" cy="245" r="7"/>
  </g>
  <text x="580" y="255" text-anchor="middle" fill="#64748b" font-size="12">More particles</text>
  <text x="580" y="275" text-anchor="middle" fill="#059669" font-size="13" font-weight="600">More total heat (J)</text>
  <rect x="120" y="310" width="260" height="160" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="250" y="340" text-anchor="middle" font-size="14" font-weight="600">Warm glass</text>
  <text x="250" y="370" text-anchor="middle" fill="#b91c1c" font-size="13">Higher temperature</text>
  <text x="250" y="395" text-anchor="middle" fill="#b91c1c" font-size="13">Faster average particles</text>
  <text x="250" y="450" text-anchor="middle" fill="#64748b" font-size="12">Same volume as cold glass</text>
  <rect x="420" y="310" width="260" height="160" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="340" text-anchor="middle" font-size="14" font-weight="600">Cold glass</text>
  <text x="550" y="370" text-anchor="middle" fill="#1d4ed8" font-size="13">Lower temperature</text>
  <text x="550" y="395" text-anchor="middle" fill="#1d4ed8" font-size="13">Slower average particles</text>
  <rect x="80" y="480" width="640" height="0"/>
  <text x="400" y="488" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Temperature = average energy · Heat = total energy of all particles</text>
</svg>
