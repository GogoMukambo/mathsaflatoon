<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Math Nexus — 8-Game Mental Math Arcade (Ages 8–11)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Fredoka:wght@500;700&display=swap');

  :root {
    --bg-dark: #070b19;
    --bg-panel: rgba(18, 28, 58, 0.78);
    --border-glow: rgba(56, 189, 248, 0.35);
    --cyan: #38bdf8;
    --emerald: #10b981;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --violet: #8b5cf6;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', sans-serif;
    background: radial-gradient(circle at 50% 0%, #172554 0%, #070b19 75%);
    color: #f8fafc;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.07) 1px, transparent 1px);
    background-size: 38px 38px;
  }

  .app-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 980px;
    padding: 14px 18px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
    border: 2px solid var(--border-glow);
    border-radius: 22px;
    padding: 12px 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .brand h1 {
    margin: 0;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.8px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .diff-toggle {
    display: flex;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 999px;
    padding: 3px;
    border: 1.5px solid rgba(255, 255, 255, 0.18);
  }

  .diff-btn {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn.active {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
    box-shadow: 0 3px 12px rgba(56, 189, 248, 0.4);
  }

  .pill-badge {
    background: rgba(0, 0, 0, 0.45);
    border: 1.5px solid rgba(245, 158, 11, 0.5);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.98rem;
    font-weight: 700;
    color: #fbbf24;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .ai-banner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(139, 92, 246, 0.18));
    border: 1.5px solid rgba(56, 189, 248, 0.32);
    border-radius: 20px;
    padding: 10px 18px;
    margin-bottom: 16px;
  }

  .bot-avatar {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
  }

  .bot-pulse { animation: botPulse 0.45s ease; }
  .bot-shake { animation: botShake 0.4s ease; }

  @keyframes botPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.16) translateY(-6px); }
  }

  @keyframes botShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .ai-text {
    font-size: 1.05rem;
    color: #e2e8f0;
  }

  /* 8-Game Arcade Grid */
  .arcade-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
  }

  .game-card {
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 16px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .game-card:hover {
    transform: translateY(-5px);
    border-color: var(--cyan);
    box-shadow: 0 12px 26px rgba(56, 189, 248, 0.22);
  }

  .game-emoji { font-size: 2.5rem; margin-bottom: 6px; }
  .game-title { font-family: 'Chakra Petch', sans-serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
  .game-desc { font-size: 0.84rem; color: #94a3b8; margin-bottom: 10px; }
  .high-score-tag {
    background: rgba(0, 0, 0, 0.45);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: #fbbf24;
    font-weight: 700;
  }

  /* Game Stage */
  .game-stage {
    width: 100%;
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
    border: 2px solid var(--border-glow);
    border-radius: 26px;
    padding: 18px;
    display: none;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }

  .game-stage.active { display: flex; }

  .hud-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid rgba(255, 255, 255, 0.24);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 7px 14px;
    border-radius: 12px;
    cursor: pointer;
  }

  .hud-stats { display: flex; gap: 10px; align-items: center; }
  .stat-box {
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1.02rem;
  }

  .timer-track {
    width: 100%;
    height: 12px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
  }

  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #10b981, #38bdf8);
    transition: width 0.25s linear, background 0.3s;
  }

  .prompt-banner {
    background: rgba(7, 11, 25, 0.72);
    border: 2px solid rgba(56, 189, 248, 0.45);
    border-radius: 18px;
    padding: 12px 26px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
    color: #fff;
  }

  .playfield {
    width: 100%;
    min-height: 330px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: rgba(5, 8, 20, 0.55);
    padding: 16px;
    overflow: hidden;
  }

  .choices-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(130px, 175px));
    gap: 14px;
    margin-top: 14px;
  }

  .choice-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 14px 10px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4);
    transition: transform 0.12s, filter 0.15s;
  }

  .choice-btn:hover { filter: brightness(1.12); transform: scale(1.03); }
  .choice-btn:active { transform: translateY(3px); }

  .c-0 { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
  .c-1 { background: linear-gradient(135deg, #059669, #047857); }
  .c-2 { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
  .c-3 { background: linear-gradient(135deg, #db2777, #be185d); }

  /* Game 1: Meteor Blast */
  .meteor-sky {
    width: 100%;
    height: 320px;
    position: relative;
    overflow: hidden;
  }

  .meteor {
    position: absolute;
    top: -75px;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f59e0b, #b91c1c);
    border: 3px solid #fde047;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.55);
    animation: meteorFall linear forwards;
  }

  @keyframes meteorFall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(420px) rotate(180deg); }
  }

  /* Game 2: Prime & Factor Bubbles */
  .bubbles-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 540px;
  }

  .bubble-btn {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 2.5px solid rgba(56, 189, 248, 0.75);
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), rgba(37, 99, 235, 0.35));
    color: #fff;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
    transition: transform 0.2s, opacity 0.2s;
  }

  .bubble-btn:hover { transform: scale(1.07); }
  .bubble-btn.popped { transform: scale(0); opacity: 0; pointer-events: none; }

  /* Game 3: Fraction Pizza Lab */
  .fraction-visual {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
  }

  .pie-svg { width: 120px; height: 120px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }

  /* Game 4: Reactor Core (Two-Factor / Two-Term Target) */
  .orbs-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }

  .orb-btn {
    width: 74px;
    height: 74px;
    border-radius: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.35);
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #38bdf8;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.65rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .orb-btn.selected {
    border-color: #fbbf24;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #070b19;
    transform: scale(1.1);
  }

  /* Game 5: Algebra Vault */
  .vault-box {
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    border: 3px solid #818cf8;
    border-radius: 20px;
    padding: 16px 28px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 0 24px rgba(129, 140, 248, 0.35);
  }

  /* Game 6: Cyber Sequence */
  .seq-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
  }

  .seq-node {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: rgba(30, 41, 59, 0.9);
    border: 2px solid #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
  }

  .seq-node.missing {
    border: 2.5px dashed #fbbf24;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.12);
  }

  /* Game 7: Scale Balance */
  .scale-beam {
    width: 310px;
    height: 12px;
    background: #38bdf8;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 12px;
    transform: rotate(-8deg);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .scale-beam.balanced { transform: rotate(0deg); background: #10b981; }

  .scale-pan {
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #94a3b8;
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 14px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .scale-base {
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 34px solid #6366f1;
    margin: 0 auto 12px;
  }

  /* Game 8: Rapid Keypad Blitz */
  .keypad-display {
    width: 220px;
    height: 56px;
    background: #020617;
    border: 2px solid #38bdf8;
    border-radius: 14px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #38bdf8;
    margin-bottom: 12px;
  }

  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    gap: 8px;
  }

  .num-key {
    height: 52px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    background: rgba(30, 41, 59, 0.85);
    color: #fff;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    cursor: pointer;
  }

  .num-key:active { background: #38bdf8; color: #070b19; }
  .num-key.enter { background: #10b981; color: #070b19; }
  .num-key.clear { background: #f43f5e; }

  /* Floating Popup & Modal */
  .float-score {
    position: fixed;
    pointer-events: none;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: #fbbf24;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
    animation: scoreRise 0.85s ease-out forwards;
    z-index: 99;
  }

  @keyframes scoreRise {
    0% { opacity: 1; transform: translateY(0) scale(0.85); }
    100% { opacity: 0; transform: translateY(-55px) scale(1.2); }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 18px;
  }

  .modal-overlay.active { display: flex; }

  .modal-card {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 2.5px solid var(--cyan);
    border-radius: 26px;
    padding: 28px 24px;
    max-width: 410px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
  }

  .modal-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }

  .primary-btn {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="app-container">
  <header>
    <div class="brand" onclick="goHome()">
      <span style="font-size: 1.7rem;">⚡</span>
      <h1>CYBER MATH NEXUS</h1>
    </div>
    <div class="controls-bar">
      <div class="diff-toggle">
        <button class="diff-btn active" id="diff-cadet" onclick="setDifficulty('cadet')">Cadet (Ages 8–9)</button>
        <button class="diff-btn" id="diff-ace" onclick="setDifficulty('ace')">Ace (Ages 10–11)</button>
      </div>
      <div class="pill-badge">💎 <span id="total-gems">0</span></div>
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="ai-banner">
    <svg class="bot-avatar" id="bot-svg" viewBox="0 0 100 100">
      <rect x="20" y="24" width="60" height="54" rx="16" fill="#38bdf8"/>
      <rect x="28" y="34" width="44" height="24" rx="8" fill="#0f172a"/>
      <circle cx="40" cy="46" r="5" fill="#10b981"/>
      <circle cx="60" cy="46" r="5" fill="#10b981"/>
      <line x1="50" y1="24" x2="50" y2="10" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="8" r="5" fill="#f43f5e"/>
      <path d="M 38 66 L 62 66" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="ai-text" id="ai-text">
      Welcome, Agent! Select any of the 8 Mental Math Missions below to train your speed and logic.
    </div>
  </div>

  <!-- 8-Game Arcade Selection Grid -->
  <div class="arcade-grid" id="arcade-menu"></div>

  <!-- Active Game Stage -->
  <div class="game-stage" id="game-stage">
    <div class="hud-row">
      <button class="back-btn" onclick="goHome()">⬅ Mission Hub</button>
      <div class="hud-stats">
        <div class="stat-box" style="color: #38bdf8;">⚡ <span id="hud-streak">0</span>x</div>
        <div class="stat-box" style="color: #fbbf24;">🏆 <span id="hud-score">0</span></div>
        <div class="stat-box" style="color: #f43f5e;">⏱️ <span id="hud-time">60</span>s</div>
      </div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="prompt-banner" id="prompt-banner">12 × 6 = ?</div>
    <div class="playfield" id="playfield"></div>
  </div>
</div>

<!-- End of Round Modal -->
<div class="modal-overlay" id="end-modal">
  <div class="modal-card">
    <div style="font-size: 3.2rem; margin-bottom: 6px;">🏆⚡💎</div>
    <h2 style="font-family:'Chakra Petch',sans-serif; color:#38bdf8; margin:0 0 8px;">MISSION COMPLETE</h2>
    <p id="end-summary" style="font-size: 1.1rem; color: #cbd5e1; margin: 8px 0;">Score: 0</p>
    <div class="modal-btns">
      <button class="primary-btn" onclick="restartCurrentGame()">Replay Mission 🔄</button>
      <button class="back-btn" onclick="goHome()">Mission Hub ⚡</button>
    </div>
  </div>
</div>

<script>
function qgChildKey(k){try{var c=new URLSearchParams(location.search).get('child')||'default';return k+'::'+c;}catch(e){return k;}}
const GAMES = [
  { id: 'meteor', emoji: '☄️', title: 'Meteor Multiply & Divide', desc: 'Blast the incoming meteor matching the product or quotient!' },
  { id: 'prime', emoji: '🫧', title: 'Prime & Factor Scanner', desc: 'Pop all 3 glowing bubbles that match the number rule!' },
  { id: 'fraction', emoji: '🍕', title: 'Fraction & Percent Lab', desc: 'Match shaded fractions to equivalent fractions or %!' },
  { id: 'reactor', emoji: '⚛️', title: 'Reactor Core Multiplier', desc: 'Select TWO power cells that multiply to the target!' },
  { id: 'algebra', emoji: '🔐', title: 'Algebra Vault Cracker', desc: 'Solve for X to unlock the high-security cyber vault!' },
  { id: 'sequence', emoji: '🧬', title: 'Cyber Pattern Decoder', desc: 'Deduce the rule and complete the number sequence!' },
  { id: 'balance', emoji: '⚖️', title: 'Equation Scale Arena', desc: 'Balance two-step operations across the energy beam!' },
  { id: 'blitz', emoji: '⌨️', title: 'Rapid Keypad Blitz', desc: 'Type fast mental math answers on the cyber numpad!' }
];

let difficulty = 'cadet'; // cadet (8-9) or ace (10-11)
let soundEnabled = true;
let totalGems = parseInt(localStorage.getItem(qgChildKey('cmn_gems')) || '0', 10);
let highScores = JSON.parse(localStorage.getItem(qgChildKey('cmn_highscores')) || '{}');

let currentGameId = null;
let score = 0;
let streak = 0;
let timeLeft = 60;
let timerInterval = null;
let spawnInterval = null;
let currentAnswer = null;
let selectedCells = [];
let bubblesLeft = 0;
let keypadBuffer = '';

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playTone(freq, type = 'sine', duration = 0.16, slideTo = null) {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxCorrect() {
  playTone(587.33, 'triangle', 0.12);
  setTimeout(() => playTone(880, 'triangle', 0.2), 90);
}

function sfxWrong() {
  playTone(185, 'sawtooth', 0.24, 110);
}

function sfxLaser() {
  playTone(720, 'sine', 0.12, 240);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
}

function setDifficulty(mode) {
  difficulty = mode;
  document.getElementById('diff-cadet').classList.toggle('active', mode === 'cadet');
  document.getElementById('diff-ace').classList.toggle('active', mode === 'ace');
  say(mode === 'cadet' ? 'Cadet Mode (Ages 8–9) active!' : 'Ace Mode (Ages 10–11) engaged — higher tables & multi-step ops!');
  if (currentGameId) nextRound();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function makeNumericChoices(correct, count = 4) {
  const set = new Set([correct]);
  while (set.size < count) {
    const offset = shuffle([-12, -10, -6, -4, -3, -2, -1, 1, 2, 3, 4, 6, 10, 12])[0];
    const cand = correct + offset;
    if (cand > 0 && cand !== correct) set.add(cand);
  }
  return shuffle([...set]);
}

function say(msg, anim = '') {
  document.getElementById('ai-text').textContent = msg;
  const svg = document.getElementById('bot-svg');
  svg.classList.remove('bot-pulse', 'bot-shake');
  void svg.offsetWidth;
  if (anim) svg.classList.add(anim);
}

function spawnScorePopup(text, x = window.innerWidth / 2, y = window.innerHeight / 2) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function renderMenu() {
  document.getElementById('total-gems').textContent = totalGems;
  const grid = document.getElementById('arcade-menu');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card" onclick="startGame('${g.id}')">
      <div class="game-emoji">${g.emoji}</div>
      <div class="game-title">${g.title}</div>
      <div class="game-desc">${g.desc}</div>
      <div class="high-score-tag">🏆 Best: ${highScores[g.id] || 0}</div>
    </div>
  `).join('');
}

function goHome() {
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  currentGameId = null;
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.remove('active');
  document.getElementById('arcade-menu').style.display = 'grid';
  renderMenu();
  say('Select your next mission, Agent!');
}

function startGame(id) {
  currentGameId = id;
  score = 0;
  streak = 0;
  timeLeft = 60;
  document.getElementById('arcade-menu').style.display = 'none';
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.add('active');
  updateHud();
  nextRound();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHud();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function restartCurrentGame() {
  if (currentGameId) startGame(currentGameId);
}

function updateHud() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-streak').textContent = streak;
  document.getElementById('hud-time').textContent = timeLeft;
  const pct = Math.max(0, (timeLeft / 60) * 100);
  const fill = document.getElementById('timer-fill');
  fill.style.width = pct + '%';
  fill.style.background = timeLeft <= 12
    ? 'linear-gradient(90deg, #f43f5e, #f59e0b)'
    : 'linear-gradient(90deg, #10b981, #38bdf8)';
}

function handleCorrect(event, basePts = 15) {
  sfxCorrect();
  streak++;
  const pts = basePts + Math.min(streak * 3, 15);
  score += pts;
  totalGems += 1;
  localStorage.setItem(qgChildKey('cmn_gems'), totalGems);
  document.getElementById('total-gems').textContent = totalGems;
  updateHud();
  say(streak >= 3 ? `⚡ ${streak}x Combo Streak! Unstoppable calculation speed!` : 'Target locked! Exact match.', 'bot-pulse');
  const x = event?.clientX || window.innerWidth / 2;
  const y = event?.clientY || window.innerHeight / 2;
  spawnScorePopup(`+${pts} 💎`, x, y);
  setTimeout(nextRound, 380);
}

function handleWrong(msg = 'Calculation mismatch! Recalibrate.') {
  sfxWrong();
  streak = 0;
  updateHud();
  say(msg, 'bot-shake');
}

function endGame() {
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  const prevBest = highScores[currentGameId] || 0;
  const isNew = score > prevBest;
  if (isNew) {
    highScores[currentGameId] = score;
    localStorage.setItem(qgChildKey('cmn_highscores'), JSON.stringify(highScores));
  }
  document.getElementById('end-summary').innerHTML =
    `Final Score: <strong>${score}</strong><br>${isNew ? '🌟 NEW RECORD SET! 🌟' : `Personal Best: ${highScores[currentGameId] || 0}`}`;
  document.getElementById('end-modal').classList.add('active');
  say('Time expired! Review your telemetry or launch another run.', 'bot-pulse');
}

function buildPieSVG(num, den) {
  const cx = 60, cy = 60, r = 52;
  let slices = '';
  for (let i = 0; i < den; i++) {
    const a1 = (i * 2 * Math.PI) / den - Math.PI / 2;
    const a2 = ((i + 1) * 2 * Math.PI) / den - Math.PI / 2;
    const x1 = cx + r * Math.cos(a1);
    const y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2);
    const y2 = cy + r * Math.sin(a2);
    const largeArc = (a2 - a1) > Math.PI ? 1 : 0;
    const fill = i < num ? '#38bdf8' : '#1e293b';
    slices += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${fill}" stroke="#0f172a" stroke-width="2.5"/>`;
  }
  return `<svg class="pie-svg" viewBox="0 0 120 120">${slices}</svg>`;
}

function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
  return true;
}

function nextRound() {
  clearInterval(spawnInterval);
  const pf = document.getElementById('playfield');
  const banner = document.getElementById('prompt-banner');
  pf.innerHTML = '';
  const isAce = difficulty === 'ace';

  if (currentGameId === 'meteor') {
    const isDiv = Math.random() < 0.45;
    const a = randInt(3, isAce ? 15 : 10);
    const b = randInt(3, isAce ? 12 : 9);
    const prod = a * b;
    currentAnswer = isDiv ? a : prod;
    banner.textContent = isDiv ? `Blast: ${prod} ÷ ${b} = ?` : `Blast: ${a} × ${b} = ?`;
    pf.innerHTML = `<div class="meteor-sky" id="meteor-sky"></div>`;

    const spawnMeteor = () => {
      const sky = document.getElementById('meteor-sky');
      if (!sky) return;
      const isHit = Math.random() < 0.45;
      const val = isHit ? currentAnswer : Math.max(2, currentAnswer + shuffle([-6, -4, -2, 2, 4, 6, 8])[0]);
      const m = document.createElement('div');
      m.className = 'meteor';
      m.textContent = val;
      m.style.left = `${randInt(6, 82)}%`;
      m.style.animationDuration = `${randInt(38, 52) / 10}s`;
      m.onclick = (e) => {
        if (val === currentAnswer) {
          sfxLaser();
          m.remove();
          handleCorrect(e, 18);
        } else {
          m.style.opacity = '0.35';
          handleWrong(`Shield hit! ${val} is incorrect.`);
        }
      };
      sky.appendChild(m);
      setTimeout(() => m.remove(), 5400);
    };
    spawnMeteor();
    setTimeout(spawnMeteor, 450);
    spawnInterval = setInterval(spawnMeteor, 900);
  }

  else if (currentGameId === 'prime') {
    bubblesLeft = 3;
    const mode = isAce ? shuffle(['prime', 'mult7', 'mult8', 'square'])[0] : shuffle(['prime', 'mult6', 'mult9'])[0];
    let poolGood = [], poolBad = [], label = '';

    for (let n = 2; n <= (isAce ? 64 : 45); n++) {
      let ok = false;
      if (mode === 'prime') { ok = isPrime(n); label = 'Pop all 3 PRIME Numbers!'; }
      else if (mode === 'mult6') { ok = n % 6 === 0; label = 'Pop all 3 Multiples of 6!'; }
      else if (mode === 'mult7') { ok = n % 7 === 0; label = 'Pop all 3 Multiples of 7!'; }
      else if (mode === 'mult8') { ok = n % 8 === 0; label = 'Pop all 3 Multiples of 8!'; }
      else if (mode === 'mult9') { ok = n % 9 === 0; label = 'Pop all 3 Multiples of 9!'; }
      else if (mode === 'square') { ok = Number.isInteger(Math.sqrt(n)); label = 'Pop all 3 SQUARE Numbers!'; }
      if (ok) poolGood.push(n); else poolBad.push(n);
    }

    const chosenGood = shuffle(poolGood).slice(0, 3).map(v => ({ val: v, ok: true }));
    const chosenBad = shuffle(poolBad).slice(0, 3).map(v => ({ val: v, ok: false }));
    banner.textContent = label;

    pf.innerHTML = `
      <div class="bubbles-wrap">
        ${shuffle([...chosenGood, ...chosenBad]).map(item =>
          `<button class="bubble-btn" onclick="popScannerBubble(event, this, ${item.ok}, ${item.val})">${item.val}</button>`
        ).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'fraction') {
    const bank = isAce ? [
      { n: 1, d: 2, ans: '50%', opts: ['50%', '25%', '20%', '75%'] },
      { n: 1, d: 4, ans: '25%', opts: ['25%', '40%', '50%', '14%'] },
      { n: 3, d: 4, ans: '75%', opts: ['75%', '34%', '60%', '80%'] },
      { n: 2, d: 5, ans: '40%', opts: ['40%', '25%', '20%', '50%'] },
      { n: 3, d: 5, ans: '60%', opts: ['60%', '35%', '75%', '50%'] },
      { n: 3, d: 10, ans: '30%', opts: ['30%', '3%', '70%', '13%'] },
      { n: 2, d: 3, ans: '4/6', opts: ['4/6', '3/4', '2/6', '5/6'] }
    ] : [
      { n: 1, d: 2, ans: '2/4', opts: ['2/4', '1/4', '3/4', '2/3'] },
      { n: 1, d: 3, ans: '2/6', opts: ['2/6', '1/6', '3/6', '2/4'] },
      { n: 2, d: 4, ans: '1/2', opts: ['1/2', '1/4', '3/4', '2/3'] },
      { n: 3, d: 6, ans: '1/2', opts: ['1/2', '1/3', '2/3', '1/6'] },
      { n: 2, d: 3, ans: '4/6', opts: ['4/6', '2/6', '3/4', '1/2'] },
      { n: 1, d: 4, ans: '2/8', opts: ['2/8', '1/8', '4/8', '2/4'] }
    ];
    const item = shuffle(bank)[0];
    currentAnswer = item.ans;
    banner.textContent = isAce ? `Convert ${item.n}/${item.d} to % or Equivalent` : `Equivalent to ${item.n}/${item.d}`;
    pf.innerHTML = `
      <div class="fraction-visual">
        ${buildPieSVG(item.n, item.d)}
        <div style="font-family:'Chakra Petch',sans-serif;font-size:2.2rem;font-weight:700;">${item.n} / ${item.d}</div>
      </div>
      <div class="choices-grid">
        ${shuffle([...item.opts]).map((opt, i) =>
          `<button class="choice-btn c-${i}" onclick="checkStringChoice(event, '${opt}')">${opt}</button>`
        ).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'reactor') {
    const f1 = randInt(3, isAce ? 12 : 9);
    const f2 = randInt(3, isAce ? 12 : 9);
    const target = f1 * f2;
    const distractors = [];
    while (distractors.length < 3) {
      const d = randInt(2, isAce ? 14 : 10);
      if (d !== f1 && d !== f2 && target % d !== 0) distractors.push(d);
    }
    const cells = shuffle([f1, f2, ...distractors]);
    selectedCells = [];
    banner.textContent = `Target Product: ${target} ⚛️`;
    pf.innerHTML = `
      <div style="color:#94a3b8;margin-bottom:8px;">Activate <strong>TWO</strong> cells that multiply to <strong>${target}</strong>:</div>
      <div class="orbs-row">
        ${cells.map((v, idx) => `<button class="orb-btn" id="cell-${idx}" onclick="selectReactorCell(event, ${idx}, ${v}, ${target})">${v}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'algebra') {
    const x = randInt(3, isAce ? 16 : 12);
    const mult = isAce ? randInt(2, 6) : 1;
    const add = randInt(4, isAce ? 25 : 18);
    const total = mult * x + add;
    currentAnswer = x;
    const eqText = mult === 1 ? `x + ${add} = ${total}` : `${mult}x + ${add} = ${total}`;
    banner.textContent = `Solve for x 🔐`;
    const choices = makeNumericChoices(x);
    pf.innerHTML = `
      <div class="vault-box">${eqText}</div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkNumericChoice(event, ${c})">x = ${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'sequence') {
    const isGeom = isAce && Math.random() < 0.45;
    let seq = [], ruleLabel = '';
    if (isGeom) {
      const start = randInt(2, 5);
      const ratio = shuffle([2, 3])[0];
      seq = [start, start * ratio, start * ratio ** 2, start * ratio ** 3];
      ruleLabel = 'Geometric Sequence (×)';
    } else {
      const start = randInt(4, 25);
      const step = randInt(isAce ? 6 : 3, isAce ? 14 : 8);
      seq = [start, start + step, start + step * 2, start + step * 3];
      ruleLabel = 'Arithmetic Sequence (+)';
    }
    const hideIdx = randInt(1, 3);
    currentAnswer = seq[hideIdx];
    banner.textContent = ruleLabel;
    const choices = makeNumericChoices(currentAnswer);
    pf.innerHTML = `
      <div class="seq-row">
        ${seq.map((n, i) => `<div class="seq-node ${i === hideIdx ? 'missing' : ''}">${i === hideIdx ? '?' : n}</div>`).join('')}
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkNumericChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'balance') {
    const a = randInt(4, isAce ? 12 : 9);
    const b = randInt(3, isAce ? 9 : 7);
    const sub = randInt(2, 10);
    currentAnswer = a * b - sub;
    banner.textContent = `Balance the Equation ⚖️`;
    const choices = makeNumericChoices(currentAnswer);
    pf.innerHTML = `
      <div class="scale-beam" id="scale-beam">
        <div class="scale-pan">(${a} × ${b}) − ${sub}</div>
        <div class="scale-pan" id="right-pan">?</div>
      </div>
      <div class="scale-base"></div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkScaleChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'blitz') {
    keypadBuffer = '';
    const op = shuffle(['+', '-', '×'])[0];
    let a, b;
    if (op === '+') { a = randInt(18, isAce ? 85 : 49); b = randInt(14, isAce ? 75 : 45); currentAnswer = a + b; }
    else if (op === '-') { a = randInt(35, isAce ? 120 : 75); b = randInt(12, a - 5); currentAnswer = a - b; }
    else { a = randInt(4, isAce ? 15 : 11); b = randInt(3, isAce ? 12 : 9); currentAnswer = a * b; }

    banner.textContent = `${a} ${op} ${b} = ?`;
    pf.innerHTML = `
      <div class="keypad-display" id="kp-display">_</div>
      <div class="numpad-grid">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-key" onclick="kpPress('${n}')">${n}</button>`).join('')}
        <button class="num-key clear" onclick="kpClear()">C</button>
        <button class="num-key" onclick="kpPress('0')">0</button>
        <button class="num-key enter" onclick="kpSubmit(event)">OK</button>
      </div>
    `;
  }
}

function checkNumericChoice(e, val) {
  if (val === currentAnswer) handleCorrect(e);
  else handleWrong(`${val} does not satisfy the equation.`);
}

function checkStringChoice(e, val) {
  if (val === currentAnswer) handleCorrect(e);
  else handleWrong(`${val} is not equivalent.`);
}

function checkScaleChoice(e, val) {
  if (val === currentAnswer) {
    document.getElementById('right-pan').textContent = val;
    document.getElementById('scale-beam').classList.add('balanced');
    handleCorrect(e);
  } else {
    handleWrong(`${val} leaves the scale unbalanced!`);
  }
}

function popScannerBubble(e, btn, ok, val) {
  if (ok) {
    sfxLaser();
    btn.classList.add('popped');
    bubblesLeft--;
    if (bubblesLeft <= 0) handleCorrect(e, 20);
    else say(`Verified! ${bubblesLeft} matching number${bubblesLeft > 1 ? 's' : ''} left.`);
  } else {
    handleWrong(`${val} fails the rule check!`);
  }
}

function selectReactorCell(e, idx, val, target) {
  const btn = document.getElementById(`cell-${idx}`);
  const found = selectedCells.findIndex(c => c.idx === idx);
  if (found >= 0) {
    selectedCells.splice(found, 1);
    btn.classList.remove('selected');
    return;
  }
  if (selectedCells.length >= 2) return;
  selectedCells.push({ idx, val });
  btn.classList.add('selected');
  sfxLaser();

  if (selectedCells.length === 2) {
    const prod = selectedCells[0].val * selectedCells[1].val;
    if (prod === target) {
      handleCorrect(e, 20);
    } else {
      handleWrong(`${selectedCells[0].val} × ${selectedCells[1].val} = ${prod}, expected ${target}.`);
      setTimeout(() => {
        selectedCells.forEach(c => document.getElementById(`cell-${c.idx}`)?.classList.remove('selected'));
        selectedCells = [];
      }, 320);
    }
  }
}

function kpPress(digit) {
  if (keypadBuffer.length >= 4) return;
  keypadBuffer += digit;
  document.getElementById('kp-display').textContent = keypadBuffer;
  playTone(620, 'sine', 0.06);
}

function kpClear() {
  keypadBuffer = '';
  document.getElementById('kp-display').textContent = '_';
}

function kpSubmit(e) {
  if (!keypadBuffer) return;
  if (parseInt(keypadBuffer, 10) === currentAnswer) {
    handleCorrect(e, 18);
  } else {
    handleWrong(`${keypadBuffer} is incorrect — try again!`);
    kpClear();
  }
}

document.addEventListener('keydown', (e) => {
  if (currentGameId !== 'blitz') return;
  if (e.key >= '0' && e.key <= '9') kpPress(e.key);
  else if (e.key === 'Backspace') kpClear();
  else if (e.key === 'Enter') kpSubmit();
});

renderMenu();
</script>
