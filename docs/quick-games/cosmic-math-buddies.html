<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Math Buddies — 8-Game Mental Math Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

  :root {
    --bg-deep: #0b0e29;
    --bg-mid: #1a1e4d;
    --card-bg: rgba(255, 255, 255, 0.11);
    --card-border: rgba(255, 255, 255, 0.25);
    --gold: #ffd166;
    --coral: #ff6b6b;
    --mint: #06d6a0;
    --sky: #4cc9f0;
    --purple: #9b5de5;
    --pink: #f15bb5;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    background: radial-gradient(circle at 20% 20%, #242b6b 0%, #0b0e29 75%);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Animated Starfield */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 140px 70px, #ffd166, rgba(0,0,0,0)),
      radial-gradient(2.5px 2.5px at 250px 160px, #4cc9f0, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 320px 40px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 410px 210px, #f15bb5, rgba(0,0,0,0));
    background-size: 450px 300px;
    animation: twinkle 8s linear infinite;
    opacity: 0.75;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.65; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-6px); }
  }

  .app-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 960px;
    padding: 14px 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Top Header Bar */
  header {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 2px solid var(--card-border);
    border-radius: 24px;
    padding: 10px 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.45rem;
    background: linear-gradient(90deg, #ffd166, #4cc9f0, #f15bb5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill-badge {
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 209, 102, 0.45);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--gold);
  }

  .diff-toggle {
    display: flex;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 999px;
    padding: 3px;
    border: 2px solid rgba(255,255,255,0.2);
  }

  .diff-btn {
    border: none;
    background: transparent;
    color: #cbd5e1;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn.active {
    background: linear-gradient(135deg, #06d6a0, #118ab2);
    color: #fff;
    box-shadow: 0 3px 10px rgba(6, 214, 160, 0.4);
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.14);
    border: 2px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.15s, background 0.2s;
  }

  .icon-btn:hover { transform: scale(1.08); background: rgba(255,255,255,0.24); }

  /* Mascot Banner */
  .mascot-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(155, 93, 229, 0.28), rgba(76, 201, 240, 0.2));
    border: 2px solid rgba(255, 255, 255, 0.22);
    border-radius: 22px;
    padding: 10px 18px;
    margin-bottom: 16px;
  }

  .zorg-avatar {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .zorg-jump { animation: zorgJump 0.55s ease; }
  .zorg-wobble { animation: zorgWobble 0.45s ease; }

  @keyframes zorgJump {
    0%, 100% { transform: translateY(0) scale(1); }
    45% { transform: translateY(-16px) scale(1.12); }
  }

  @keyframes zorgWobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    75% { transform: rotate(14deg); }
  }

  .speech-bubble {
    font-size: 1.08rem;
    font-weight: 600;
    color: #f8fafc;
    line-height: 1.3;
  }

  /* Arcade Menu Grid */
  .arcade-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
    gap: 14px;
  }

  .game-card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border: 2px solid var(--card-border);
    border-radius: 24px;
    padding: 16px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .game-card:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: var(--gold);
    box-shadow: 0 12px 26px rgba(255, 209, 102, 0.25);
  }

  .game-emoji {
    font-size: 2.7rem;
    margin-bottom: 6px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }

  .game-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 2px 0 4px;
    color: #fff;
  }

  .game-desc {
    font-size: 0.85rem;
    color: #cbd5e1;
    margin-bottom: 10px;
  }

  .high-score-tag {
    background: rgba(0,0,0,0.35);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: var(--gold);
    font-weight: 700;
  }

  /* Active Game Stage */
  .game-stage {
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    border: 2px solid var(--card-border);
    border-radius: 28px;
    padding: 18px;
    display: none;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 14px 35px rgba(0,0,0,0.45);
  }

  .game-stage.active { display: flex; }

  .hud-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.28);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 7px 14px;
    border-radius: 14px;
    cursor: pointer;
  }

  .hud-stats {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .stat-box {
    background: rgba(0,0,0,0.38);
    padding: 6px 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .timer-track {
    width: 100%;
    height: 14px;
    background: rgba(0,0,0,0.4);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 2px solid rgba(255,255,255,0.18);
  }

  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #06d6a0, #ffd166);
    border-radius: 999px;
    transition: width 0.25s linear, background 0.3s;
  }

  .prompt-banner {
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(76, 201, 240, 0.45);
    border-radius: 22px;
    padding: 12px 26px;
    font-size: 2.1rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }

  .playfield {
    width: 100%;
    min-height: 330px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    background: rgba(8, 11, 36, 0.45);
    padding: 16px;
    overflow: hidden;
  }

  /* Answer Grid Buttons */
  .choices-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 165px));
    gap: 14px;
    margin-top: 14px;
  }

  .choice-btn {
    font-family: inherit;
    font-size: 1.85rem;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 14px 10px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35);
    transition: transform 0.12s, filter 0.15s;
  }

  .choice-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .choice-btn:hover { filter: brightness(1.1); transform: scale(1.04); }

  .c-0 { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
  .c-1 { background: linear-gradient(135deg, #4cc9f0, #4361ee); }
  .c-2 { background: linear-gradient(135deg, #06d6a0, #059669); }
  .c-3 { background: linear-gradient(135deg, #f15bb5, #9b5de5); }

  /* Game 1: Balloons */
  .balloon-sky {
    width: 100%;
    height: 320px;
    position: relative;
    overflow: hidden;
  }

  .balloon {
    position: absolute;
    bottom: -95px;
    width: 74px;
    height: 88px;
    border-radius: 50% 50% 48% 48%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: inset -8px -10px 18px rgba(0,0,0,0.25), inset 8px 10px 16px rgba(255,255,255,0.45);
    animation: floatUp linear forwards;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -24px;
    left: 50%;
    width: 2px;
    height: 24px;
    background: rgba(255,255,255,0.6);
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-220px) rotate(4deg); }
    100% { transform: translateY(-450px) rotate(-3deg); }
  }

  /* Game 2: Puzzle */
  .puzzle-board {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
  }

  .puzzle-piece {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #9b5de5, #f15bb5);
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  }

  .puzzle-slot {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    border: 3px dashed #ffd166;
    background: rgba(255, 209, 102, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1rem;
    color: #ffd166;
  }

  /* Game 3: Rocket Orbs */
  .rocket-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .rocket-icon {
    font-size: 3.6rem;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .rocket-launch {
    transform: translateY(-180px) scale(1.25);
  }

  .orbs-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .orb-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.4);
    background: radial-gradient(circle at 30% 30%, #4cc9f0, #3a0ca3);
    color: #fff;
    font-family: inherit;
    font-size: 1.65rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .orb-btn.selected {
    border-color: #ffd166;
    background: radial-gradient(circle at 30% 30%, #ffd166, #f77f00);
    color: #0b0e29;
    transform: scale(1.12);
  }

  /* Game 4: Cookies */
  .cookie-plates {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .plate {
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 12px 16px;
    min-width: 115px;
    min-height: 85px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }

  /* Game 5: UFO Bubbles */
  .bubbles-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 520px;
  }

  .bubble-btn {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid rgba(76, 201, 240, 0.7);
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(76, 201, 240, 0.25));
    color: #fff;
    font-family: inherit;
    font-size: 1.35rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(76, 201, 240, 0.35);
    transition: transform 0.2s, opacity 0.2s;
  }

  .bubble-btn:hover { transform: scale(1.07); }
  .bubble-btn.popped { transform: scale(0); opacity: 0; pointer-events: none; }

  /* Game 6: Dino Eggs */
  .eggs-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .egg-btn {
    width: 96px;
    height: 118px;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    border: 3px solid #ffd166;
    background: radial-gradient(circle at 35% 30%, #fff8e7, #f4a261);
    color: #1d1e2c;
    font-family: inherit;
    font-size: 1.85rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s;
  }

  .egg-btn:hover { transform: translateY(-6px) rotate(3deg); }

  /* Game 7: Star Bridge */
  .bridge-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
  }

  .bridge-stone {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    border: 2px solid #4cc9f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.65rem;
    font-weight: 700;
  }

  .bridge-stone.missing {
    background: rgba(255, 209, 102, 0.16);
    border: 3px dashed #ffd166;
    color: #ffd166;
  }

  /* Game 8: Balance Scale */
  .scale-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 12px;
  }

  .scale-beam {
    width: 280px;
    height: 12px;
    background: #ffd166;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 12px;
    transform: rotate(-8deg);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .scale-beam.balanced { transform: rotate(0deg); }

  .scale-pan {
    background: rgba(255,255,255,0.2);
    border: 2px solid #fff;
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 14px;
    font-size: 1.35rem;
    font-weight: 700;
  }

  .scale-base {
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 34px solid #ef476f;
  }

  /* Floating Score Popup */
  .float-score {
    position: fixed;
    pointer-events: none;
    font-size: 1.6rem;
    font-weight: 700;
    color: #ffd166;
    text-shadow: 0 3px 8px rgba(0,0,0,0.6);
    animation: scoreRise 0.85s ease-out forwards;
    z-index: 99;
  }

  @keyframes scoreRise {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-55px) scale(1.25); }
  }

  /* Game Over Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 28, 0.82);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 18px;
  }

  .modal-overlay.active { display: flex; }

  .modal-card {
    background: linear-gradient(145deg, #1e245c, #12163b);
    border: 3px solid var(--gold);
    border-radius: 28px;
    padding: 28px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .modal-card h2 {
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--gold);
  }

  .modal-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }

  .primary-btn {
    background: linear-gradient(135deg, #06d6a0, #118ab2);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="stars"></div>

<div class="app-container">
  <header>
    <div class="brand" onclick="goHome()">
      <span style="font-size: 1.8rem;">🛸</span>
      <h1>Cosmic Math Buddies</h1>
    </div>
    <div class="controls-bar">
      <div class="diff-toggle">
        <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">Easy (1–10)</button>
        <button class="diff-btn" id="diff-super" onclick="setDifficulty('super')">Super (1–20)</button>
      </div>
      <div class="pill-badge">⭐ <span id="total-stars">0</span></div>
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="mascot-bar">
    <svg class="zorg-avatar" id="zorg-svg" viewBox="0 0 100 100">
      <line x1="50" y1="18" x2="50" y2="5" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="5" r="5" fill="#ff6b6b"/>
      <ellipse cx="50" cy="56" rx="34" ry="32" fill="#06d6a0"/>
      <ellipse cx="50" cy="64" rx="22" ry="16" fill="#80ffdb" opacity="0.55"/>
      <circle cx="38" cy="46" r="9" fill="#fff"/>
      <circle cx="62" cy="46" r="9" fill="#fff"/>
      <circle cx="39" cy="46" r="4.5" fill="#0b0e29"/>
      <circle cx="63" cy="46" r="4.5" fill="#0b0e29"/>
      <path d="M 38 64 Q 50 75 62 64" stroke="#0b0e29" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="speech-bubble" id="mascot-text">
      Hi Earth Friend! Pick any of the 8 space math games below!
    </div>
  </div>

  <!-- 8-Game Arcade Selection Grid -->
  <div class="arcade-grid" id="arcade-menu"></div>

  <!-- Active Game Stage -->
  <div class="game-stage" id="game-stage">
    <div class="hud-row">
      <button class="back-btn" onclick="goHome()">⬅ Arcade</button>
      <div class="hud-stats">
        <div class="stat-box" style="color: #4cc9f0;">🔥 <span id="hud-streak">0</span></div>
        <div class="stat-box" style="color: #ffd166;">🏆 <span id="hud-score">0</span></div>
        <div class="stat-box" style="color: #ff6b6b;">⏱️ <span id="hud-time">60</span>s</div>
      </div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="prompt-banner" id="prompt-banner">2 + 3 = ?</div>
    <div class="playfield" id="playfield"></div>
  </div>
</div>

<!-- End of Round Modal -->
<div class="modal-overlay" id="end-modal">
  <div class="modal-card">
    <div style="font-size: 3.4rem; margin-bottom: 6px;">🎉🚀⭐</div>
    <h2>Awesome Job!</h2>
    <p id="end-summary" style="font-size: 1.15rem; color: #e2e8f0; margin: 8px 0;">You scored 0 points!</p>
    <div class="modal-btns">
      <button class="primary-btn" onclick="restartCurrentGame()">Play Again 🔄</button>
      <button class="back-btn" onclick="goHome()">All Games 🛸</button>
    </div>
  </div>
</div>

<script>
function qgChildKey(k){try{var c=new URLSearchParams(location.search).get('child')||'default';return k+'::'+c;}catch(e){return k;}}
const GAMES = [
  { id: 'balloons', emoji: '🎈', title: 'Balloon Pop Math', desc: 'Pop the floating balloon with the right answer!' },
  { id: 'puzzle', emoji: '🧩', title: 'Cosmic Number Puzzle', desc: 'Snap the missing piece to complete the sum!' },
  { id: 'rocket', emoji: '🚀', title: 'Rocket Fuel-Up', desc: 'Pick TWO energy orbs that add up to launch!' },
  { id: 'cookies', emoji: '🍪', title: 'Alien Cookie Counter', desc: 'Count the yummy cosmic cookies!' },
  { id: 'ufo', emoji: '🛸', title: 'UFO Bubble Catcher', desc: 'Pop all 3 space bubbles matching the UFO number!' },
  { id: 'dino', emoji: '🥚', title: 'Dino Egg Hatcher', desc: 'Tap the right egg to hatch a baby space-dino!' },
  { id: 'bridge', emoji: '🌉', title: 'Star Bridge Builder', desc: 'Find the missing number in the space pattern!' },
  { id: 'scale', emoji: '⚖️', title: 'Balance Scale Monsters', desc: 'Pick the matching weight to level the scale!' }
];

let difficulty = 'easy';
let soundEnabled = true;
let totalStars = parseInt(localStorage.getItem(qgChildKey('cmb_stars')) || '0', 10);
let highScores = JSON.parse(localStorage.getItem(qgChildKey('cmb_highscores')) || '{}');

let currentGameId = null;
let score = 0;
let streak = 0;
let timeLeft = 60;
let timerInterval = null;
let balloonInterval = null;
let currentAnswer = 0;
let rocketSelection = [];
let ufoRemaining = 0;

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playTone(freq, type = 'sine', duration = 0.18, slideTo = null) {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) {
    osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxCorrect() {
  playTone(523.25, 'triangle', 0.14);
  setTimeout(() => playTone(659.25, 'triangle', 0.14), 80);
  setTimeout(() => playTone(783.99, 'triangle', 0.22), 160);
}

function sfxWrong() {
  playTone(220, 'sawtooth', 0.25, 140);
}

function sfxPop() {
  playTone(400, 'sine', 0.12, 850);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
}

function setDifficulty(level) {
  difficulty = level;
  document.getElementById('diff-easy').classList.toggle('active', level === 'easy');
  document.getElementById('diff-super').classList.toggle('active', level === 'super');
  say(level === 'easy' ? 'Easy mode (1–10)! Great for warm-ups!' : 'Super mode (1–20)! Cosmic brain power!');
  if (currentGameId) nextRound();
}

function maxNum() {
  return difficulty === 'easy' ? 10 : 20;
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function makeChoices(correct, count = 4) {
  const set = new Set([correct]);
  const cap = maxNum() + 4;
  while (set.size < count) {
    let delta = randInt(-4, 4);
    let candidate = correct + delta;
    if (candidate >= 0 && candidate <= cap && candidate !== correct) {
      set.add(candidate);
    }
  }
  return shuffle([...set]);
}

function say(msg, anim = '') {
  document.getElementById('mascot-text').textContent = msg;
  const svg = document.getElementById('zorg-svg');
  svg.classList.remove('zorg-jump', 'zorg-wobble');
  void svg.offsetWidth;
  if (anim) svg.classList.add(anim);
}

function spawnScorePopup(text, x = window.innerWidth / 2, y = window.innerHeight / 2) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function renderMenu() {
  document.getElementById('total-stars').textContent = totalStars;
  const grid = document.getElementById('arcade-menu');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card" onclick="startGame('${g.id}')">
      <div class="game-emoji">${g.emoji}</div>
      <div class="game-title">${g.title}</div>
      <div class="game-desc">${g.desc}</div>
      <div class="high-score-tag">🏆 Best: ${highScores[g.id] || 0}</div>
    </div>
  `).join('');
}

function goHome() {
  clearInterval(timerInterval);
  clearInterval(balloonInterval);
  currentGameId = null;
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.remove('active');
  document.getElementById('arcade-menu').style.display = 'grid';
  renderMenu();
  say('Welcome back! Choose your next space adventure!');
}

function startGame(id) {
  currentGameId = id;
  score = 0;
  streak = 0;
  timeLeft = 60;
  document.getElementById('arcade-menu').style.display = 'none';
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.add('active');
  updateHud();
  nextRound();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHud();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function restartCurrentGame() {
  if (currentGameId) startGame(currentGameId);
}

function updateHud() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-streak').textContent = streak;
  document.getElementById('hud-time').textContent = timeLeft;
  const pct = Math.max(0, (timeLeft / 60) * 100);
  const fill = document.getElementById('timer-fill');
  fill.style.width = pct + '%';
  fill.style.background = timeLeft <= 12
    ? 'linear-gradient(90deg, #ff6b6b, #f77f00)'
    : 'linear-gradient(90deg, #06d6a0, #ffd166)';
}

function handleCorrect(event, bonus = 10) {
  sfxCorrect();
  streak++;
  const pts = bonus + Math.min(streak * 2, 10);
  score += pts;
  totalStars += 1;
  localStorage.setItem(qgChildKey('cmb_stars'), totalStars);
  document.getElementById('total-stars').textContent = totalStars;
  updateHud();
  say(streak >= 3 ? `🔥 ${streak} in a row! Cosmic genius!` : 'Woohoo! Spot on!', 'zorg-jump');
  const x = event?.clientX || window.innerWidth / 2;
  const y = event?.clientY || window.innerHeight / 2;
  spawnScorePopup(`+${pts} ⭐`, x, y);
  setTimeout(nextRound, 420);
}

function handleWrong(msg = 'Oops! Try another one!') {
  sfxWrong();
  streak = 0;
  updateHud();
  say(msg, 'zorg-wobble');
}

function endGame() {
  clearInterval(timerInterval);
  clearInterval(balloonInterval);
  const prevBest = highScores[currentGameId] || 0;
  const isNewRecord = score > prevBest;
  if (isNewRecord) {
    highScores[currentGameId] = score;
    localStorage.setItem(qgChildKey('cmb_highscores'), JSON.stringify(highScores));
  }
  document.getElementById('end-summary').innerHTML =
    `You scored <strong>${score}</strong> points!<br>${isNewRecord ? '🌟 NEW HIGH SCORE! 🌟' : `Best Score: ${highScores[currentGameId] || 0}`}`;
  document.getElementById('end-modal').classList.add('active');
  say('Time is up! Look at all those shiny stars you earned!', 'zorg-jump');
}

function nextRound() {
  clearInterval(balloonInterval);
  const pf = document.getElementById('playfield');
  const banner = document.getElementById('prompt-banner');
  pf.innerHTML = '';

  const limit = maxNum();

  if (currentGameId === 'balloons') {
    const a = randInt(1, Math.floor(limit * 0.6));
    const b = randInt(1, limit - a);
    currentAnswer = a + b;
    banner.textContent = `Pop: ${a} + ${b} = ?`;
    pf.innerHTML = `<div class="balloon-sky" id="balloon-sky"></div>`;
    const colors = ['#ff6b6b', '#4cc9f0', '#06d6a0', '#f15bb5', '#f77f00', '#9b5de5'];
    const spawnBalloon = () => {
      const sky = document.getElementById('balloon-sky');
      if (!sky) return;
      const isTarget = Math.random() < 0.45;
      const val = isTarget ? currentAnswer : randInt(1, limit + 2);
      const bEl = document.createElement('div');
      bEl.className = 'balloon';
      bEl.textContent = val;
      bEl.style.left = `${randInt(8, 82)}%`;
      bEl.style.background = colors[randInt(0, colors.length - 1)];
      bEl.style.animationDuration = `${randInt(42, 60) / 10}s`;
      bEl.onclick = (e) => {
        if (val === currentAnswer) {
          sfxPop();
          bEl.remove();
          handleCorrect(e, 12);
        } else {
          bEl.style.opacity = '0.35';
          handleWrong(`Not ${val}! Look for ${a} + ${b}!`);
        }
      };
      sky.appendChild(bEl);
      setTimeout(() => bEl.remove(), 6200);
    };
    spawnBalloon();
    setTimeout(spawnBalloon, 500);
    balloonInterval = setInterval(spawnBalloon, 950);
  }

  else if (currentGameId === 'puzzle') {
    const target = randInt(5, limit);
    const partA = randInt(1, target - 1);
    currentAnswer = target - partA;
    banner.textContent = `Make ${target}! 🧩`;
    const choices = makeChoices(currentAnswer);
    pf.innerHTML = `
      <div class="puzzle-board">
        <div class="puzzle-piece">${partA}<span style="font-size:0.85rem;">⭐</span></div>
        <div style="font-size:2rem;font-weight:700;">+</div>
        <div class="puzzle-slot" id="puzzle-slot">?</div>
        <div style="font-size:2rem;font-weight:700;">=</div>
        <div class="puzzle-piece" style="background:linear-gradient(135deg,#06d6a0,#118ab2);">${target}</div>
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'rocket') {
    const target = randInt(6, limit);
    const orb1 = randInt(1, target - 1);
    const orb2 = target - orb1;
    let distractors = [];
    while (distractors.length < 3) {
      let d = randInt(1, target - 1);
      if (d !== orb1 && d !== orb2) distractors.push(d);
    }
    const orbs = shuffle([orb1, orb2, ...distractors]);
    rocketSelection = [];
    banner.textContent = `Fuel Needed: ${target} 🚀`;
    pf.innerHTML = `
      <div class="rocket-zone">
        <div class="rocket-icon" id="rocket-icon">🚀</div>
        <div style="font-size:1rem;color:#cbd5e1;">Tap <strong>TWO</strong> orbs that add up to ${target}!</div>
        <div class="orbs-row">
          ${orbs.map((val, idx) => `<button class="orb-btn" id="orb-${idx}" onclick="selectOrb(event, ${idx}, ${val}, ${target})">${val}</button>`).join('')}
        </div>
      </div>
    `;
  }

  else if (currentGameId === 'cookies') {
    const isAdd = Math.random() < 0.65;
    let a = randInt(2, Math.floor(limit * 0.6));
    let b = randInt(1, isAdd ? limit - a : a - 1);
    currentAnswer = isAdd ? a + b : a - b;
    banner.textContent = isAdd ? `${a} + ${b} Cookies` : `${a} − ${b} Cookies`;
    const choices = makeChoices(currentAnswer);
    pf.innerHTML = `
      <div class="cookie-plates">
        <div class="plate">${'🍪'.repeat(a)}</div>
        <div style="font-size:2.2rem;font-weight:700;">${isAdd ? '➕' : '➖'}</div>
        <div class="plate">${'🍪'.repeat(b)}</div>
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'ufo') {
    const target = randInt(5, limit);
    ufoRemaining = 3;
    banner.textContent = `UFO Target: ${target} 🛸`;
    const bubbles = [];
    for (let i = 0; i < 3; i++) {
      const x = randInt(1, target - 1);
      bubbles.push({ label: `${x} + ${target - x}`, match: true });
    }
    while (bubbles.length < 6) {
      const x = randInt(1, limit - 1);
      const y = randInt(1, limit - 1);
      if (x + y !== target) bubbles.push({ label: `${x} + ${y}`, match: false });
    }
    pf.innerHTML = `
      <div style="margin-bottom:12px;color:#4cc9f0;font-weight:700;">Pop all 3 bubbles equal to ${target}!</div>
      <div class="bubbles-wrap">
        ${shuffle(bubbles).map((b, i) => `<button class="bubble-btn" onclick="popUfoBubble(event, this, ${b.match})">${b.label}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'dino') {
    const a = randInt(2, limit);
    const b = randInt(1, a - 1);
    const isSub = Math.random() < 0.5;
    currentAnswer = isSub ? a - b : Math.min(limit, a + b);
    banner.textContent = isSub ? `${a} − ${b} = ?` : `${a} + ${currentAnswer - a} = ?`;
    const choices = makeChoices(currentAnswer, 4);
    pf.innerHTML = `
      <div style="font-size:2.8rem;margin-bottom:10px;">🦕🌿</div>
      <div class="eggs-row">
        ${choices.map(c => `<button class="egg-btn" onclick="hatchEgg(event, this, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'bridge') {
    const step = difficulty === 'easy' ? shuffle([1, 2])[0] : shuffle([1, 2, 3, 5])[0];
    const start = randInt(1, 6);
    const seq = [start, start + step, start + step * 2, start + step * 3];
    const hideIdx = randInt(1, 3);
    currentAnswer = seq[hideIdx];
    banner.textContent = `Pattern: +${step}s 🌉`;
    const choices = makeChoices(currentAnswer);
    pf.innerHTML = `
      <div class="bridge-row">
        ${seq.map((n, i) => `<div class="bridge-stone ${i === hideIdx ? 'missing' : ''}">${i === hideIdx ? '?' : n}</div>`).join('')}
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'scale') {
    const leftA = randInt(2, Math.floor(limit * 0.6));
    const leftB = randInt(1, limit - leftA);
    currentAnswer = leftA + leftB;
    banner.textContent = `Balance the Scale! ⚖️`;
    const choices = makeChoices(currentAnswer);
    pf.innerHTML = `
      <div class="scale-container">
        <div class="scale-beam" id="scale-beam">
          <div class="scale-pan">${leftA} + ${leftB}</div>
          <div class="scale-pan" id="right-pan">?</div>
        </div>
        <div class="scale-base"></div>
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkScale(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }
}

function checkChoice(e, val) {
  if (val === currentAnswer) {
    const slot = document.getElementById('puzzle-slot');
    if (slot) slot.textContent = val;
    handleCorrect(e);
  } else {
    handleWrong(`Not quite! ${val} doesn't fit.`);
  }
}

function selectOrb(e, idx, val, target) {
  const btn = document.getElementById(`orb-${idx}`);
  const existingPos = rocketSelection.findIndex(item => item.idx === idx);
  if (existingPos >= 0) {
    rocketSelection.splice(existingPos, 1);
    btn.classList.remove('selected');
    return;
  }
  if (rocketSelection.length >= 2) return;
  rocketSelection.push({ idx, val });
  btn.classList.add('selected');
  sfxPop();

  if (rocketSelection.length === 2) {
    const sum = rocketSelection[0].val + rocketSelection[1].val;
    if (sum === target) {
      document.getElementById('rocket-icon').classList.add('rocket-launch');
      handleCorrect(e, 15);
    } else {
      handleWrong(`${rocketSelection[0].val} + ${rocketSelection[1].val} = ${sum}, not ${target}!`);
      setTimeout(() => {
        rocketSelection.forEach(item => document.getElementById(`orb-${item.idx}`)?.classList.remove('selected'));
        rocketSelection = [];
      }, 350);
    }
  }
}

function popUfoBubble(e, btn, isMatch) {
  if (isMatch) {
    sfxPop();
    btn.classList.add('popped');
    ufoRemaining--;
    if (ufoRemaining <= 0) {
      handleCorrect(e, 15);
    } else {
      say(`Nice! ${ufoRemaining} more matching bubble${ufoRemaining > 1 ? 's' : ''}!`);
    }
  } else {
    handleWrong('Wrong bubble! Check the sum again!');
  }
}

function hatchEgg(e, btn, val) {
  if (val === currentAnswer) {
    btn.textContent = '🦖';
    btn.style.background = '#06d6a0';
    handleCorrect(e);
  } else {
    handleWrong(`Egg ${val} didn't hatch! Try another!`);
  }
}

function checkScale(e, val) {
  if (val === currentAnswer) {
    document.getElementById('right-pan').textContent = val;
    document.getElementById('scale-beam').classList.add('balanced');
    handleCorrect(e);
  } else {
    handleWrong(`${val} won't level the scale!`);
  }
}

renderMenu();
</script>
</body>
</html>
