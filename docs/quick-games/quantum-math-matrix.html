<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quantum Math Matrix — 8-Game Mental Math & Algebra Arcade (Ages 12–15)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap');

  :root {
    --bg-void: #060913;
    --bg-card: rgba(15, 23, 42, 0.84);
    --border-neon: rgba(16, 185, 129, 0.35);
    --emerald: #10b981;
    --cyan: #06b6d4;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --indigo: #6366f1;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Space Grotesk', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0f172a 0%, #060913 80%);
    color: #f1f5f9;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .matrix-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(rgba(16, 185, 129, 0.14) 1px, transparent 1px),
      linear-gradient(rgba(6, 182, 212, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
    background-size: 32px 32px, 64px 64px, 64px 64px;
  }

  .app-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 980px;
    padding: 14px 18px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    backdrop-filter: blur(14px);
    border: 1.5px solid var(--border-neon);
    border-radius: 20px;
    padding: 12px 20px;
    margin-bottom: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .brand h1 {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #10b981, #06b6d4, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .diff-toggle {
    display: flex;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 999px;
    padding: 3px;
    border: 1.5px solid rgba(255, 255, 255, 0.16);
  }

  .diff-btn {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.84rem;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn.active {
    background: linear-gradient(135deg, #10b981, #06b6d4);
    color: #060913;
    box-shadow: 0 3px 12px rgba(16, 185, 129, 0.4);
  }

  .pill-badge {
    background: rgba(0, 0, 0, 0.5);
    border: 1.5px solid rgba(16, 185, 129, 0.45);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: #34d399;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .ai-banner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(6, 182, 212, 0.14));
    border: 1.5px solid rgba(16, 185, 129, 0.3);
    border-radius: 18px;
    padding: 10px 18px;
    margin-bottom: 16px;
  }

  .core-svg {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
  }

  .core-pulse { animation: corePulse 0.42s ease; }
  .core-shake { animation: coreShake 0.38s ease; }

  @keyframes corePulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.18) rotate(45deg); }
  }

  @keyframes coreShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .ai-text {
    font-size: 1.02rem;
    color: #e2e8f0;
  }

  /* 8-Game Arcade Grid */
  .arcade-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
  }

  .game-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 16px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .game-card:hover {
    transform: translateY(-5px);
    border-color: var(--emerald);
    box-shadow: 0 12px 26px rgba(16, 185, 129, 0.2);
  }

  .game-emoji { font-size: 2.3rem; margin-bottom: 6px; }
  .game-title { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; font-weight: 700; margin-bottom: 5px; color: #fff; }
  .game-desc { font-size: 0.84rem; color: #94a3b8; margin-bottom: 10px; line-height: 1.35; }
  .high-score-tag {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: #34d399;
    font-weight: 700;
  }

  /* Game Stage */
  .game-stage {
    width: 100%;
    background: var(--bg-card);
    backdrop-filter: blur(14px);
    border: 1.5px solid var(--border-neon);
    border-radius: 24px;
    padding: 18px;
    display: none;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  }

  .game-stage.active { display: flex; }

  .hud-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 7px 14px;
    border-radius: 12px;
    cursor: pointer;
  }

  .hud-stats { display: flex; gap: 10px; align-items: center; }
  .stat-box {
    background: rgba(0, 0, 0, 0.5);
    padding: 6px 14px;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.98rem;
  }

  .timer-track {
    width: 100%;
    height: 11px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.14);
  }

  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #10b981, #06b6d4);
    transition: width 0.25s linear, background 0.3s;
  }

  .prompt-banner {
    background: rgba(6, 9, 19, 0.82);
    border: 1.5px solid rgba(16, 185, 129, 0.45);
    border-radius: 16px;
    padding: 12px 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.85rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
    color: #fff;
  }

  .playfield {
    width: 100%;
    min-height: 330px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(4, 7, 16, 0.65);
    padding: 16px;
    overflow: hidden;
  }

  .choices-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(145px, 195px));
    gap: 14px;
    margin-top: 14px;
  }

  .choice-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.45rem;
    font-weight: 700;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 14px 10px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.45);
    transition: transform 0.12s, filter 0.15s;
  }

  .choice-btn:hover { filter: brightness(1.14); transform: scale(1.03); }
  .choice-btn:active { transform: translateY(3px); }

  .c-0 { background: linear-gradient(135deg, #0284c7, #1d4ed8); }
  .c-1 { background: linear-gradient(135deg, #059669, #047857); }
  .c-2 { background: linear-gradient(135deg, #4f46e5, #6d28d9); }
  .c-3 { background: linear-gradient(135deg, #be185d, #9f1239); }

  /* Game 1: Falling Expression Pods */
  .pod-sky {
    width: 100%;
    height: 320px;
    position: relative;
    overflow: hidden;
  }

  .pod {
    position: absolute;
    top: -75px;
    min-width: 84px;
    height: 68px;
    padding: 0 14px;
    border-radius: 18px;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border: 2.5px solid #10b981;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: #34d399;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
    animation: podDrop linear forwards;
  }

  @keyframes podDrop {
    0% { transform: translateY(0); }
    100% { transform: translateY(420px); }
  }

  /* Game 2: Algebra & Number Bubbles */
  .bubbles-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 560px;
  }

  .bubble-btn {
    width: 122px;
    height: 104px;
    border-radius: 22px;
    border: 2px solid rgba(6, 182, 212, 0.7);
    background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.25), rgba(15, 23, 42, 0.85));
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(6, 182, 212, 0.25);
    transition: transform 0.2s, opacity 0.2s;
  }

  .bubble-btn:hover { transform: scale(1.06); border-color: #10b981; }
  .bubble-btn.popped { transform: scale(0); opacity: 0; pointer-events: none; }

  /* Game 4: Factor Pair Matrix (Quadratic / Sum-Product) */
  .orbs-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }

  .orb-btn {
    min-width: 74px;
    height: 70px;
    padding: 0 12px;
    border-radius: 16px;
    border: 2px solid rgba(255, 255, 255, 0.28);
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #38bdf8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .orb-btn.selected {
    border-color: #10b981;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #060913;
    transform: scale(1.08);
  }

  /* Equation Box */
  .eq-display {
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    border: 2px solid #6366f1;
    border-radius: 18px;
    padding: 16px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 0 24px rgba(99, 102, 241, 0.3);
  }

  /* Sequence Nodes */
  .seq-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
  }

  .seq-node {
    min-width: 74px;
    height: 70px;
    padding: 0 10px;
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.95);
    border: 2px solid #06b6d4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.45rem;
    font-weight: 700;
  }

  .seq-node.missing {
    border: 2px dashed #10b981;
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
  }

  /* Balance Scale */
  .scale-beam {
    width: 330px;
    height: 11px;
    background: #06b6d4;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 12px;
    transform: rotate(-8deg);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .scale-beam.balanced { transform: rotate(0deg); background: #10b981; }

  .scale-pan {
    background: rgba(15, 23, 42, 0.95);
    border: 2px solid #94a3b8;
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.25rem;
    font-weight: 700;
  }

  .scale-base {
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 34px solid #10b981;
    margin: 0 auto 12px;
  }

  /* Keypad Blitz (with +/- sign toggle) */
  .keypad-display {
    width: 240px;
    height: 56px;
    background: #020617;
    border: 2px solid #10b981;
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #34d399;
    margin-bottom: 12px;
  }

  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 76px);
    gap: 8px;
  }

  .num-key {
    height: 50px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    background: rgba(30, 41, 59, 0.9);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.35rem;
    font-weight: 700;
    cursor: pointer;
  }

  .num-key:active { background: #10b981; color: #060913; }
  .num-key.enter { background: #10b981; color: #060913; }
  .num-key.clear { background: #f43f5e; }
  .num-key.sign { background: #4f46e5; }

  /* Floating Score & Modal */
  .float-score {
    position: fixed;
    pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: #34d399;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85);
    animation: scoreRise 0.85s ease-out forwards;
    z-index: 99;
  }

  @keyframes scoreRise {
    0% { opacity: 1; transform: translateY(0) scale(0.85); }
    100% { opacity: 0; transform: translateY(-55px) scale(1.2); }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 18, 0.86);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 18px;
  }

  .modal-overlay.active { display: flex; }

  .modal-card {
    background: linear-gradient(145deg, #0f172a, #020617);
    border: 2px solid var(--emerald);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
  }

  .modal-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }

  .primary-btn {
    background: linear-gradient(135deg, #10b981, #06b6d4);
    border: none;
    color: #060913;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="matrix-grid"></div>

<div class="app-container">
  <header>
    <div class="brand" onclick="goHome()">
      <span style="font-size: 1.65rem;">⚛️</span>
      <h1>QUANTUM MATH MATRIX</h1>
    </div>
    <div class="controls-bar">
      <div class="diff-toggle">
        <button class="diff-btn active" id="diff-core" onclick="setDifficulty('core')">Core (Ages 12–13)</button>
        <button class="diff-btn" id="diff-pro" onclick="setDifficulty('pro')">Pro (Ages 14–15)</button>
      </div>
      <div class="pill-badge">💠 <span id="total-xp">0</span> XP</div>
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="ai-banner">
    <svg class="core-svg" id="core-svg" viewBox="0 0 100 100">
      <polygon points="50,8 90,30 90,70 50,92 10,70 10,30" fill="none" stroke="#10b981" stroke-width="5"/>
      <polygon points="50,22 76,37 76,63 50,78 24,63 24,37" fill="rgba(6,182,212,0.25)" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="50" cy="50" r="10" fill="#10b981"/>
    </svg>
    <div class="ai-text" id="ai-text">
      System online. Choose any of the 8 Mental Math & Algebra challenges below to test your calculation velocity.
    </div>
  </div>

  <!-- 8-Game Arcade Selection Grid -->
  <div class="arcade-grid" id="arcade-menu"></div>

  <!-- Active Game Stage -->
  <div class="game-stage" id="game-stage">
    <div class="hud-row">
      <button class="back-btn" onclick="goHome()">⬅ Matrix Hub</button>
      <div class="hud-stats">
        <div class="stat-box" style="color: #06b6d4;">⚡ <span id="hud-streak">0</span>x</div>
        <div class="stat-box" style="color: #34d399;">🏆 <span id="hud-score">0</span></div>
        <div class="stat-box" style="color: #f43f5e;">⏱️ <span id="hud-time">60</span>s</div>
      </div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="prompt-banner" id="prompt-banner">3x − 7 = 14</div>
    <div class="playfield" id="playfield"></div>
  </div>
</div>

<!-- End of Round Modal -->
<div class="modal-overlay" id="end-modal">
  <div class="modal-card">
    <div style="font-size: 3rem; margin-bottom: 6px;">⚛️🏆💠</div>
    <h2 style="font-family:'JetBrains Mono',monospace; color:#10b981; margin:0 0 8px;">SIMULATION COMPLETE</h2>
    <p id="end-summary" style="font-size: 1.08rem; color: #cbd5e1; margin: 8px 0;">Score: 0</p>
    <div class="modal-btns">
      <button class="primary-btn" onclick="restartCurrentGame()">Run Again 🔄</button>
      <button class="back-btn" onclick="goHome()">Matrix Hub ⚛️</button>
    </div>
  </div>
</div>

<script>
function qgChildKey(k){try{var c=new URLSearchParams(location.search).get('child')||'default';return k+'::'+c;}catch(e){return k;}}
const GAMES = [
  { id: 'pods', emoji: '☄️', title: 'Integer & Exponent Pods', desc: 'Intercept falling pods matching signed arithmetic, squares & roots!' },
  { id: 'likeTerms', emoji: '🫧', title: 'Like-Terms & Factor Filter', desc: 'Pop all 3 expressions equivalent to the target algebraic term!' },
  { id: 'linear', emoji: '🔐', title: 'Linear Equation Cracker', desc: 'Solve two-step and variables-on-both-sides equations for x!' },
  { id: 'quadratic', emoji: '⚛️', title: 'Quadratic Factor Pair', desc: 'Pick TWO numbers that multiply to c and add to b!' },
  { id: 'percent', emoji: '📊', title: 'Percent & Ratio Engine', desc: 'Calculate rapid percentages, discounts, and ratios!' },
  { id: 'sequence', emoji: '🧬', title: 'nth-Term Sequence Lab', desc: 'Find missing terms in negative, square, or geometric series!' },
  { id: 'balance', emoji: '⚖️', title: 'Algebraic Scale Arena', desc: 'Evaluate algebraic expressions for given values of x and y!' },
  { id: 'blitz', emoji: '⌨️', title: 'Signed Mental Blitz', desc: 'Fast keyboard/numpad calculations with negative numbers & PEMDAS!' }
];

let difficulty = 'core'; // core (12-13) or pro (14-15)
let soundEnabled = true;
let totalXP = parseInt(localStorage.getItem(qgChildKey('qmm_xp')) || '0', 10);
let highScores = JSON.parse(localStorage.getItem(qgChildKey('qmm_highscores')) || '{}');

let currentGameId = null;
let score = 0;
let streak = 0;
let timeLeft = 60;
let timerInterval = null;
let spawnInterval = null;
let currentAnswer = null;
let selectedPair = [];
let bubblesLeft = 0;
let keypadBuffer = '';

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playTone(freq, type = 'sine', duration = 0.15, slideTo = null) {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxCorrect() {
  playTone(523.25, 'triangle', 0.11);
  setTimeout(() => playTone(783.99, 'triangle', 0.19), 85);
}

function sfxWrong() {
  playTone(175, 'sawtooth', 0.24, 105);
}

function sfxSnap() {
  playTone(680, 'sine', 0.11, 280);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
}

function setDifficulty(mode) {
  difficulty = mode;
  document.getElementById('diff-core').classList.toggle('active', mode === 'core');
  document.getElementById('diff-pro').classList.toggle('active', mode === 'pro');
  say(mode === 'core'
    ? 'Core Mode (Ages 12–13): Two-step equations, signed integers, squares & percentages.'
    : 'Pro Mode (Ages 14–15): Both-sides algebra, quadratic factor pairs, roots & multi-step PEMDAS.');
  if (currentGameId) nextRound();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function makeSignedChoices(correct, count = 4) {
  const set = new Set([correct]);
  while (set.size < count) {
    const offset = shuffle([-9, -6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 9])[0];
    const cand = correct + offset;
    if (cand !== correct) set.add(cand);
  }
  return shuffle([...set]);
}

function say(msg, anim = '') {
  document.getElementById('ai-text').textContent = msg;
  const svg = document.getElementById('core-svg');
  svg.classList.remove('core-pulse', 'core-shake');
  void svg.offsetWidth;
  if (anim) svg.classList.add(anim);
}

function spawnScorePopup(text, x = window.innerWidth / 2, y = window.innerHeight / 2) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = text;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function renderMenu() {
  document.getElementById('total-xp').textContent = totalXP;
  const grid = document.getElementById('arcade-menu');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card" onclick="startGame('${g.id}')">
      <div class="game-emoji">${g.emoji}</div>
      <div class="game-title">${g.title}</div>
      <div class="game-desc">${g.desc}</div>
      <div class="high-score-tag">🏆 Best: ${highScores[g.id] || 0}</div>
    </div>
  `).join('');
}

function goHome() {
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  currentGameId = null;
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.remove('active');
  document.getElementById('arcade-menu').style.display = 'grid';
  renderMenu();
  say('Select your next module from the Matrix Hub.');
}

function startGame(id) {
  currentGameId = id;
  score = 0;
  streak = 0;
  timeLeft = 60;
  document.getElementById('arcade-menu').style.display = 'none';
  document.getElementById('end-modal').classList.remove('active');
  document.getElementById('game-stage').classList.add('active');
  updateHud();
  nextRound();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHud();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function restartCurrentGame() {
  if (currentGameId) startGame(currentGameId);
}

function updateHud() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-streak').textContent = streak;
  document.getElementById('hud-time').textContent = timeLeft;
  const pct = Math.max(0, (timeLeft / 60) * 100);
  const fill = document.getElementById('timer-fill');
  fill.style.width = pct + '%';
  fill.style.background = timeLeft <= 12
    ? 'linear-gradient(90deg, #f43f5e, #f59e0b)'
    : 'linear-gradient(90deg, #10b981, #06b6d4)';
}

function handleCorrect(event, basePts = 20) {
  sfxCorrect();
  streak++;
  const pts = basePts + Math.min(streak * 4, 20);
  score += pts;
  totalXP += pts;
  localStorage.setItem(qgChildKey('qmm_xp'), totalXP);
  document.getElementById('total-xp').textContent = totalXP;
  updateHud();
  say(streak >= 3 ? `⚡ ${streak}x Quantum Streak! Peak mental precision!` : 'Solution verified.', 'core-pulse');
  const x = event?.clientX || window.innerWidth / 2;
  const y = event?.clientY || window.innerHeight / 2;
  spawnScorePopup(`+${pts} XP`, x, y);
  setTimeout(nextRound, 380);
}

function handleWrong(msg = 'Syntax or calculation error — try again.') {
  sfxWrong();
  streak = 0;
  updateHud();
  say(msg, 'core-shake');
}

function endGame() {
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  const prevBest = highScores[currentGameId] || 0;
  const isNew = score > prevBest;
  if (isNew) {
    highScores[currentGameId] = score;
    localStorage.setItem(qgChildKey('qmm_highscores'), JSON.stringify(highScores));
  }
  document.getElementById('end-summary').innerHTML =
    `Simulation Score: <strong>${score}</strong><br>${isNew ? '🌟 NEW PERSONAL RECORD! 🌟' : `All-Time Best: ${highScores[currentGameId] || 0}`}`;
  document.getElementById('end-modal').classList.add('active');
  say('Time elapsed. Review your score or launch another simulation.', 'core-pulse');
}

function nextRound() {
  clearInterval(spawnInterval);
  const pf = document.getElementById('playfield');
  const banner = document.getElementById('prompt-banner');
  pf.innerHTML = '';
  const isPro = difficulty === 'pro';

  if (currentGameId === 'pods') {
    const type = shuffle(['signedMult', 'power', 'root'])[0];
    let label = '';
    if (type === 'signedMult') {
      const a = randInt(-12, -3);
      const b = isPro ? randInt(-11, 12) || 4 : randInt(3, 12);
      currentAnswer = a * b;
      label = `(${a}) × (${b})`;
    } else if (type === 'power') {
      const base = isPro ? randInt(6, 16) : randInt(4, 13);
      currentAnswer = base * base;
      label = `${base}²`;
    } else {
      const root = isPro ? randInt(7, 18) : randInt(4, 13);
      currentAnswer = root;
      label = `√${root * root}`;
    }
    banner.textContent = `Evaluate: ${label}`;
    pf.innerHTML = `<div class="pod-sky" id="pod-sky"></div>`;

    const spawnPod = () => {
      const sky = document.getElementById('pod-sky');
      if (!sky) return;
      const isHit = Math.random() < 0.45;
      const val = isHit ? currentAnswer : currentAnswer + shuffle([-12, -6, -4, -2, 2, 4, 6, 12])[0];
      const p = document.createElement('div');
      p.className = 'pod';
      p.textContent = val;
      p.style.left = `${randInt(6, 80)}%`;
      p.style.animationDuration = `${randInt(38, 52) / 10}s`;
      p.onclick = (e) => {
        if (val === currentAnswer) {
          sfxSnap();
          p.remove();
          handleCorrect(e, 20);
        } else {
          p.style.opacity = '0.35';
          handleWrong(`${val} ≠ ${label}`);
        }
      };
      sky.appendChild(p);
      setTimeout(() => p.remove(), 5400);
    };
    spawnPod();
    setTimeout(spawnPod, 450);
    spawnInterval = setInterval(spawnPod, 900);
  }

  else if (currentGameId === 'likeTerms') {
    bubblesLeft = 3;
    const banks = isPro ? [
      { target: '6x²', good: ['2x · 3x', '9x² − 3x²', '12x³ ÷ 2x'], bad: ['6x', '3x + 3x', '2x² · 3x'] },
      { target: '4x − 6', good: ['2(2x − 3)', '6x − 2x − 6', '2x + 2x − 6'], bad: ['2(2x − 6)', '4(x − 6)', '2x − 3'] },
      { target: '−5x + 2', good: ['3x − 8x + 2', '2 − 5x', '−(5x − 2)'], bad: ['5x − 2', '−5x − 2', '3x − 8x − 2'] },
      { target: '8a³', good: ['2a · 4a²', '10a³ − 2a³', '16a⁴ ÷ 2a'], bad: ['4a + 4a²', '8a²', '2a³ · 4a'] }
    ] : [
      { target: '5x', good: ['2x + 3x', '8x − 3x', '10x ÷ 2'], bad: ['5 + x', '2x + 3', '5x²'] },
      { target: '3x + 6', good: ['3(x + 2)', '5x − 2x + 6', '2x + x + 6'], bad: ['3(x + 6)', '3x + 2', '9x'] },
      { target: '4y − 2', good: ['6y − 2y − 2', '2(2y − 1)', 'y + 3y − 2'], bad: ['2(2y − 2)', '2y', '4y + 2'] },
      { target: '6x²', good: ['2x · 3x', '4x² + 2x²', '7x² − x²'], bad: ['6x', '3x + 3x', '5x² + 1'] }
    ];
    const item = shuffle(banks)[0];
    banner.textContent = `Pop all 3 equal to: ${item.target}`;
    const combined = shuffle([
      ...item.good.map(t => ({ text: t, ok: true })),
      ...item.bad.map(t => ({ text: t, ok: false }))
    ]);
    pf.innerHTML = `
      <div class="bubbles-wrap">
        ${combined.map(b => `<button class="bubble-btn" onclick="popAlgBubble(event, this, ${b.ok}, '${b.text}')">${b.text}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'linear') {
    const x = randInt(-9, 12) || 4;
    let eqText = '';
    if (isPro) {
      // Variables on both sides: ax + b = cx + d
      const c = randInt(2, 5);
      const a = c + randInt(2, 5);
      const b = randInt(-12, 12) || 3;
      const d = (a - c) * x + b;
      const bStr = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;
      const dStr = d >= 0 ? `+ ${d}` : `− ${Math.abs(d)}`;
      eqText = `${a}x ${bStr} = ${c}x ${dStr}`;
    } else {
      // Two-step: ax + b = c
      const a = randInt(2, 8);
      const b = randInt(-15, 15) || 5;
      const c = a * x + b;
      const bStr = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;
      eqText = `${a}x ${bStr} = ${c}`;
    }
    currentAnswer = x;
    banner.textContent = `Solve for x 🔐`;
    const choices = makeSignedChoices(x);
    pf.innerHTML = `
      <div class="eq-display">${eqText}</div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">x = ${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'quadratic') {
    // Find r1, r2 such that r1 + r2 = b and r1 * r2 = c
    const r1 = randInt(isPro ? -8 : 1, 9) || 3;
    const r2 = randInt(isPro ? -8 : 1, 9) || -2;
    const b = r1 + r2;
    const c = r1 * r2;
    const distractors = [];
    while (distractors.length < 3) {
      const d = randInt(-10, 12);
      if (d !== r1 && d !== r2 && !distractors.includes(d)) distractors.push(d);
    }
    const pool = shuffle([r1, r2, ...distractors]);
    selectedPair = [];
    const bSign = b >= 0 ? `+ ${b}x` : `− ${Math.abs(b)}x`;
    const cSign = c >= 0 ? `+ ${c}` : `− ${Math.abs(c)}`;
    banner.textContent = `Factor: x² ${bSign} ${cSign}`;
    pf.innerHTML = `
      <div style="color:#94a3b8;margin-bottom:8px;">Select <strong>TWO</strong> numbers with sum <strong>${b}</strong> and product <strong>${c}</strong>:</div>
      <div class="orbs-row">
        ${pool.map((v, idx) => `<button class="orb-btn" id="qcell-${idx}" onclick="selectFactorPair(event, ${idx}, ${v}, ${b}, ${c})">${v}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'percent') {
    const pcts = isPro ? [15, 20, 25, 30, 35, 40, 60, 75] : [10, 20, 25, 50, 75];
    const p = shuffle(pcts)[0];
    const base = (p % 25 === 0) ? randInt(2, 16) * 20 : randInt(2, 18) * 10;
    currentAnswer = (p * base) / 100;
    banner.textContent = `Calculate: ${p}% of ${base}`;
    const choices = makeSignedChoices(currentAnswer);
    pf.innerHTML = `
      <div class="eq-display">${p}% × ${base} = ?</div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'sequence') {
    const mode = isPro ? shuffle(['geomNeg', 'squares', 'arithNeg'])[0] : shuffle(['arithNeg', 'squares'])[0];
    let seq = [], label = '';
    if (mode === 'arithNeg') {
      const start = randInt(5, 20);
      const step = randInt(-9, -3);
      seq = [start, start + step, start + step * 2, start + step * 3];
      label = 'Linear Sequence (Negative Step)';
    } else if (mode === 'squares') {
      const n = randInt(2, 7);
      seq = [n ** 2, (n + 1) ** 2, (n + 2) ** 2, (n + 3) ** 2];
      label = 'Quadratic Sequence (n²)';
    } else {
      const start = randInt(2, 4);
      const r = shuffle([-2, 3])[0];
      seq = [start, start * r, start * r ** 2, start * r ** 3];
      label = 'Geometric Sequence (Common Ratio)';
    }
    const hideIdx = randInt(1, 3);
    currentAnswer = seq[hideIdx];
    banner.textContent = label;
    const choices = makeSignedChoices(currentAnswer);
    pf.innerHTML = `
      <div class="seq-row">
        ${seq.map((val, i) => `<div class="seq-node ${i === hideIdx ? 'missing' : ''}">${i === hideIdx ? '?' : val}</div>`).join('')}
      </div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'balance') {
    const x = randInt(-5, 8) || 3;
    const y = randInt(2, 7);
    const a = randInt(2, 6);
    const b = randInt(2, 5);
    currentAnswer = isPro ? (a * x + b * y) : (a * x - b);
    const expr = isPro ? `${a}x + ${b}y  (x=${x}, y=${y})` : `${a}x − ${b}  (x=${x})`;
    banner.textContent = `Evaluate Expression ⚖️`;
    const choices = makeSignedChoices(currentAnswer);
    pf.innerHTML = `
      <div class="scale-beam" id="scale-beam">
        <div class="scale-pan">${expr}</div>
        <div class="scale-pan" id="right-pan">?</div>
      </div>
      <div class="scale-base"></div>
      <div class="choices-grid">
        ${choices.map((c, i) => `<button class="choice-btn c-${i}" onclick="checkScaleChoice(event, ${c})">${c}</button>`).join('')}
      </div>
    `;
  }

  else if (currentGameId === 'blitz') {
    keypadBuffer = '';
    const op = shuffle(['pemdas', 'signedAdd', 'squareSub'])[0];
    let promptStr = '';
    if (op === 'pemdas') {
      const a = randInt(3, 12);
      const b = randInt(2, 9);
      const c = randInt(4, 20);
      currentAnswer = c + a * b;
      promptStr = `${c} + ${a} × ${b}`;
    } else if (op === 'signedAdd') {
      const a = randInt(-18, -4);
      const b = randInt(-15, 22) || 7;
      currentAnswer = a + b;
      promptStr = `(${a}) + (${b})`;
    } else {
      const a = randInt(5, isPro ? 14 : 11);
      const b = randInt(2, a - 1);
      currentAnswer = a * a - b * b;
      promptStr = `${a}² − ${b}²`;
    }
    banner.textContent = `${promptStr} = ?`;
    pf.innerHTML = `
      <div class="keypad-display" id="kp-display">_</div>
      <div class="numpad-grid">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-key" onclick="kpPress('${n}')">${n}</button>`).join('')}
        <button class="num-key sign" onclick="kpToggleSign()">+/−</button>
        <button class="num-key" onclick="kpPress('0')">0</button>
        <button class="num-key enter" onclick="kpSubmit(event)">OK</button>
      </div>
      <button class="back-btn" style="margin-top:8px;" onclick="kpClear()">Clear (C)</button>
    `;
  }
}

function checkChoice(e, val) {
  if (val === currentAnswer) handleCorrect(e);
  else handleWrong(`${val} does not satisfy the equation.`);
}

function checkScaleChoice(e, val) {
  if (val === currentAnswer) {
    document.getElementById('right-pan').textContent = val;
    document.getElementById('scale-beam').classList.add('balanced');
    handleCorrect(e);
  } else {
    handleWrong(`${val} leaves the expression unbalanced.`);
  }
}

function popAlgBubble(e, btn, ok, text) {
  if (ok) {
    sfxSnap();
    btn.classList.add('popped');
    bubblesLeft--;
    if (bubblesLeft <= 0) handleCorrect(e, 25);
    else say(`Equivalent term verified! ${bubblesLeft} remaining.`);
  } else {
    handleWrong(`${text} is not algebraically equivalent.`);
  }
}

function selectFactorPair(e, idx, val, targetSum, targetProd) {
  const btn = document.getElementById(`qcell-${idx}`);
  const found = selectedPair.findIndex(item => item.idx === idx);
  if (found >= 0) {
    selectedPair.splice(found, 1);
    btn.classList.remove('selected');
    return;
  }
  if (selectedPair.length >= 2) return;
  selectedPair.push({ idx, val });
  btn.classList.add('selected');
  sfxSnap();

  if (selectedPair.length === 2) {
    const s = selectedPair[0].val + selectedPair[1].val;
    const p = selectedPair[0].val * selectedPair[1].val;
    if (s === targetSum && p === targetProd) {
      handleCorrect(e, 25);
    } else {
      handleWrong(`Sum = ${s}, Product = ${p} (need sum ${targetSum}, product ${targetProd}).`);
      setTimeout(() => {
        selectedPair.forEach(item => document.getElementById(`qcell-${item.idx}`)?.classList.remove('selected'));
        selectedPair = [];
      }, 340);
    }
  }
}

function kpPress(digit) {
  if (keypadBuffer.length >= 5) return;
  keypadBuffer += digit;
  document.getElementById('kp-display').textContent = keypadBuffer;
  playTone(640, 'sine', 0.05);
}

function kpToggleSign() {
  if (!keypadBuffer) keypadBuffer = '-';
  else if (keypadBuffer === '-') keypadBuffer = '';
  else if (keypadBuffer.startsWith('-')) keypadBuffer = keypadBuffer.slice(1);
  else keypadBuffer = '-' + keypadBuffer;
  document.getElementById('kp-display').textContent = keypadBuffer || '_';
}

function kpClear() {
  keypadBuffer = '';
  document.getElementById('kp-display').textContent = '_';
}

function kpSubmit(e) {
  if (!keypadBuffer || keypadBuffer === '-') return;
  if (parseInt(keypadBuffer, 10) === currentAnswer) {
    handleCorrect(e, 22);
  } else {
    handleWrong(`${keypadBuffer} is incorrect — check signs and order of operations!`);
    kpClear();
  }
}

document.addEventListener('keydown', (e) => {
  if (currentGameId !== 'blitz') return;
  if (e.key >= '0' && e.key <= '9') kpPress(e.key);
  else if (e.key === '-') kpToggleSign();
  else if (e.key === 'Backspace') kpClear();
  else if (e.key === 'Enter') kpSubmit();
});

renderMenu();
</script>
</body>
</html>
