<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="chalk-board">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .glyph { opacity: 0; }
      .glyph.is-ink { opacity: 1; }
      .is-on { display: block; }
      .chalk-step:not(.is-on) { display: none; }
      text { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="800" height="500"/>

  <!-- Step 0: Title -->
  <g class="chalk-step" data-step="0">
    <text x="400" y="220" text-anchor="middle" font-size="48" fill="#14285c">
      <tspan class="glyph">S</tspan><tspan class="glyph">c</tspan><tspan class="glyph">i</tspan><tspan class="glyph">e</tspan><tspan class="glyph">n</tspan><tspan class="glyph">c</tspan><tspan class="glyph">e</tspan>
      <tspan class="glyph"> </tspan>
      <tspan class="glyph">C</tspan><tspan class="glyph">h</tspan><tspan class="glyph">a</tspan><tspan class="glyph">p</tspan><tspan class="glyph">t</tspan><tspan class="glyph">e</tspan><tspan class="glyph">r</tspan>
      <tspan class="glyph"> </tspan>
      <tspan class="glyph">1</tspan>
    </text>
    <text x="400" y="280" text-anchor="middle" font-size="36" fill="#2d6bff">
      <tspan class="glyph">R</tspan><tspan class="glyph">e</tspan><tspan class="glyph">s</tspan><tspan class="glyph">p</tspan><tspan class="glyph">i</tspan><tspan class="glyph">r</tspan><tspan class="glyph">a</tspan><tspan class="glyph">t</tspan><tspan class="glyph">i</tspan><tspan class="glyph">o</tspan><tspan class="glyph">n</tspan>
    </text>
  </g>

  <!-- Step 1: Respiratory System -->
  <g class="chalk-step" data-step="1">
    <text x="400" y="60" text-anchor="middle" font-size="32" fill="#14285c">
      <tspan class="glyph">1</tspan><tspan class="glyph">.</tspan><tspan class="glyph">1</tspan><tspan class="glyph"> </tspan><tspan class="glyph">T</tspan><tspan class="glyph">h</tspan><tspan class="glyph">e</tspan><tspan class="glyph"> </tspan><tspan class="glyph">R</tspan><tspan class="glyph">e</tspan><tspan class="glyph">s</tspan><tspan class="glyph">p</tspan><tspan class="glyph">i</tspan><tspan class="glyph">r</tspan><tspan class="glyph">a</tspan><tspan class="glyph">t</tspan><tspan class="glyph">o</tspan><tspan class="glyph">r</tspan><tspan class="glyph">y</tspan><tspan class="glyph"> </tspan><tspan class="glyph">S</tspan><tspan class="glyph">y</tspan><tspan class="glyph">s</tspan><tspan class="glyph">t</tspan><tspan class="glyph">e</tspan><tspan class="glyph">m</tspan>
    </text>
    
    <!-- Trachea -->
    <path class="draw" d="M 400 120 L 400 220" stroke="#059669" stroke-width="12" />
    <path class="draw" d="M 380 140 L 420 140 M 380 160 L 420 160 M 380 180 L 420 180 M 380 200 L 420 200" stroke="#047857" stroke-width="4" />
    
    <!-- Bronchi -->
    <path class="draw" d="M 400 220 L 330 300" stroke="#059669" stroke-width="10" />
    <path class="draw" d="M 400 220 L 470 300" stroke="#059669" stroke-width="10" />
    
    <!-- Lungs -->
    <path class="draw" d="M 340 220 C 260 220 240 380 340 420 C 370 420 380 340 340 300" stroke="#ec4899" stroke-width="4" fill="rgba(236,72,153,0.1)" />
    <path class="draw" d="M 460 220 C 540 220 560 380 460 420 C 430 420 420 340 460 300" stroke="#ec4899" stroke-width="4" fill="rgba(236,72,153,0.1)" />
    
    <!-- Labels -->
    <text x="280" y="160" font-size="24" fill="#047857"><tspan class="glyph">T</tspan><tspan class="glyph">r</tspan><tspan class="glyph">a</tspan><tspan class="glyph">c</tspan><tspan class="glyph">h</tspan><tspan class="glyph">e</tspan><tspan class="glyph">a</tspan></text>
    <path class="draw" d="M 360 160 L 390 160" stroke="#047857" stroke-width="2" />
    
    <text x="520" y="260" font-size="24" fill="#047857"><tspan class="glyph">B</tspan><tspan class="glyph">r</tspan><tspan class="glyph">o</tspan><tspan class="glyph">n</tspan><tspan class="glyph">c</tspan><tspan class="glyph">h</tspan><tspan class="glyph">u</tspan><tspan class="glyph">s</tspan></text>
    <path class="draw" d="M 450 260 L 510 260" stroke="#047857" stroke-width="2" />
    
    <text x="220" y="340" font-size="24" fill="#be185d"><tspan class="glyph">L</tspan><tspan class="glyph">u</tspan><tspan class="glyph">n</tspan><tspan class="glyph">g</tspan></text>
    <path class="draw" d="M 280 340 L 310 340" stroke="#be185d" stroke-width="2" />
  </g>

  <!-- Step 2: Gas Exchange -->
  <g class="chalk-step" data-step="2">
    <text x="400" y="60" text-anchor="middle" font-size="32" fill="#14285c">
      <tspan class="glyph">1</tspan><tspan class="glyph">.</tspan><tspan class="glyph">2</tspan><tspan class="glyph"> </tspan><tspan class="glyph">G</tspan><tspan class="glyph">a</tspan><tspan class="glyph">s</tspan><tspan class="glyph"> </tspan><tspan class="glyph">E</tspan><tspan class="glyph">x</tspan><tspan class="glyph">c</tspan><tspan class="glyph">h</tspan><tspan class="glyph">a</tspan><tspan class="glyph">n</tspan><tspan class="glyph">g</tspan><tspan class="glyph">e</tspan>
    </text>
    
    <!-- Alveolus -->
    <path class="draw" d="M 400 120 L 400 200" stroke="#059669" stroke-width="8" />
    <circle cx="400" cy="280" r="80" stroke="#ec4899" stroke-width="6" fill="rgba(236,72,153,0.2)" class="draw" />
    
    <!-- Capillary -->
    <path class="draw" d="M 280 380 C 340 440 460 440 520 380" stroke="#dc2626" stroke-width="16" />
    
    <!-- O2 Arrow -->
    <path class="draw" d="M 400 280 L 400 380" stroke="#3b82f6" stroke-width="6" />
    <path class="draw" d="M 380 360 L 400 380 L 420 360" stroke="#3b82f6" stroke-width="6" />
    <text x="360" y="340" font-size="24" fill="#3b82f6"><tspan class="glyph">O</tspan><tspan class="glyph">2</tspan></text>
    
    <!-- CO2 Arrow -->
    <path class="draw" d="M 460 380 L 460 280" stroke="#f59e0b" stroke-width="6" />
    <path class="draw" d="M 440 300 L 460 280 L 480 300" stroke="#f59e0b" stroke-width="6" />
    <text x="490" y="340" font-size="24" fill="#f59e0b"><tspan class="glyph">C</tspan><tspan class="glyph">O</tspan><tspan class="glyph">2</tspan></text>
    
    <text x="400" y="240" text-anchor="middle" font-size="24" fill="#be185d"><tspan class="glyph">A</tspan><tspan class="glyph">l</tspan><tspan class="glyph">v</tspan><tspan class="glyph">e</tspan><tspan class="glyph">o</tspan><tspan class="glyph">l</tspan><tspan class="glyph">u</tspan><tspan class="glyph">s</tspan></text>
    <text x="400" y="440" text-anchor="middle" font-size="24" fill="#991b1b"><tspan class="glyph">B</tspan><tspan class="glyph">l</tspan><tspan class="glyph">o</tspan><tspan class="glyph">o</tspan><tspan class="glyph">d</tspan><tspan class="glyph"> </tspan><tspan class="glyph">C</tspan><tspan class="glyph">a</tspan><tspan class="glyph">p</tspan><tspan class="glyph">i</tspan><tspan class="glyph">l</tspan><tspan class="glyph">l</tspan><tspan class="glyph">a</tspan><tspan class="glyph">r</tspan><tspan class="glyph">y</tspan></text>
  </g>

  <!-- Step 3: Respiration Equation -->
  <g class="chalk-step" data-step="3">
    <text x="400" y="60" text-anchor="middle" font-size="32" fill="#14285c">
      <tspan class="glyph">1</tspan><tspan class="glyph">.</tspan><tspan class="glyph">4</tspan><tspan class="glyph"> </tspan><tspan class="glyph">R</tspan><tspan class="glyph">e</tspan><tspan class="glyph">s</tspan><tspan class="glyph">p</tspan><tspan class="glyph">i</tspan><tspan class="glyph">r</tspan><tspan class="glyph">a</tspan><tspan class="glyph">t</tspan><tspan class="glyph">i</tspan><tspan class="glyph">o</tspan><tspan class="glyph">n</tspan><tspan class="glyph"> </tspan><tspan class="glyph">E</tspan><tspan class="glyph">q</tspan><tspan class="glyph">u</tspan><tspan class="glyph">a</tspan><tspan class="glyph">t</tspan><tspan class="glyph">i</tspan><tspan class="glyph">o</tspan><tspan class="glyph">n</tspan>
    </text>
    
    <rect x="100" y="140" width="600" height="200" rx="20" stroke="#2d6bff" stroke-width="6" fill="rgba(45,107,255,0.05)" class="draw" />
    
    <text x="400" y="200" text-anchor="middle" font-size="36" fill="#047857">
      <tspan class="glyph">G</tspan><tspan class="glyph">l</tspan><tspan class="glyph">u</tspan><tspan class="glyph">c</tspan><tspan class="glyph">o</tspan><tspan class="glyph">s</tspan><tspan class="glyph">e</tspan>
      <tspan class="glyph"> </tspan><tspan class="glyph">+</tspan><tspan class="glyph"> </tspan>
      <tspan class="glyph">O</tspan><tspan class="glyph">x</tspan><tspan class="glyph">y</tspan><tspan class="glyph">g</tspan><tspan class="glyph">e</tspan><tspan class="glyph">n</tspan>
    </text>
    
    <path class="draw" d="M 400 240 L 400 280" stroke="#14285c" stroke-width="6" />
    <path class="draw" d="M 380 260 L 400 280 L 420 260" stroke="#14285c" stroke-width="6" />
    
    <text x="400" y="320" text-anchor="middle" font-size="28" fill="#b45309">
      <tspan class="glyph">C</tspan><tspan class="glyph">a</tspan><tspan class="glyph">r</tspan><tspan class="glyph">b</tspan><tspan class="glyph">o</tspan><tspan class="glyph">n</tspan><tspan class="glyph"> </tspan><tspan class="glyph">D</tspan><tspan class="glyph">i</tspan><tspan class="glyph">o</tspan><tspan class="glyph">x</tspan><tspan class="glyph">i</tspan><tspan class="glyph">d</tspan><tspan class="glyph">e</tspan>
      <tspan class="glyph"> </tspan><tspan class="glyph">+</tspan><tspan class="glyph"> </tspan>
      <tspan class="glyph">W</tspan><tspan class="glyph">a</tspan><tspan class="glyph">t</tspan><tspan class="glyph">e</tspan><tspan class="glyph">r</tspan>
      <tspan class="glyph"> </tspan><tspan class="glyph">+</tspan><tspan class="glyph"> </tspan>
    </text>
    <text x="400" y="380" text-anchor="middle" font-size="36" fill="#dc2626">
      <tspan class="glyph">E</tspan><tspan class="glyph">N</tspan><tspan class="glyph">E</tspan><tspan class="glyph">R</tspan><tspan class="glyph">G</tspan><tspan class="glyph">Y</tspan><tspan class="glyph">!</tspan>
    </text>
  </g>
</svg>
