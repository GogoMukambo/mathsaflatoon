<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Original superhero tropes (not any trademarked character) -->
  <g fill="none" stroke="#7a1820" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- armored helm -->
    <g transform="translate(28 36)">
      <path d="M12 34 Q12 8 32 8 Q52 8 52 34 L48 48 Q32 54 16 48 Z"/>
      <path d="M20 28 h8 M36 28 h8"/>
      <path d="M32 8 v10"/>
    </g>
    <!-- cape hero -->
    <g transform="translate(160 30)">
      <circle cx="28" cy="12" r="8"/>
      <path d="M28 20 v22"/>
      <path d="M16 28 L28 22 L40 28"/>
      <path d="M18 42 Q8 58 22 70 Q28 52 28 42"/>
    </g>
    <!-- round shield -->
    <g transform="translate(290 40)">
      <circle cx="28" cy="28" r="22"/>
      <circle cx="28" cy="28" r="12"/>
      <polygon points="28,16 31,25 40,25 33,31 36,40 28,34 20,40 23,31 16,25 25,25"/>
    </g>
    <!-- gauntlet -->
    <g transform="translate(40 160)">
      <path d="M18 10 h16 v28 h-16 z"/>
      <path d="M20 10 v-8 M26 10 v-10 M32 10 v-8"/>
      <path d="M18 38 q8 12 16 0"/>
    </g>
    <!-- mask -->
    <g transform="translate(175 165)">
      <ellipse cx="28" cy="22" rx="24" ry="16"/>
      <path d="M14 20 q6 4 12 0"/>
      <path d="M30 20 q6 4 12 0"/>
    </g>
    <!-- flying figure -->
    <g transform="translate(300 155)">
      <circle cx="18" cy="10" r="6"/>
      <path d="M18 16 L10 40 L18 34 L26 40 Z"/>
      <path d="M8 22 L18 20 L28 22"/>
      <path d="M12 40 l-4 10 M24 40 l4 10"/>
    </g>
    <!-- lightning -->
    <g transform="translate(50 290)">
      <path d="M28 4 L12 28 h12 L10 56 L36 24 h-12 Z"/>
    </g>
    <!-- city leap silhouette -->
    <g transform="translate(170 295)">
      <path d="M8 48 V28 h8 v-10 h8 v10 h10 v20"/>
      <circle cx="44" cy="22" r="5"/>
      <path d="M44 27 L38 40 L50 40"/>
    </g>
    <!-- star burst -->
    <g transform="translate(300 300)">
      <polygon points="24,4 28,18 42,18 31,26 35,40 24,32 13,40 17,26 6,18 20,18"/>
    </g>
